name: Build All OnePlus Kernels
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "配置文件//Configuration file"
        required: true
        default: oneplus_ace5
        options:
          - oneplus_13
          - oneplus_13_global
          - oneplus_13s
          - oneplus_13t
          - oneplus_ace5_pro
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_12_u
          - oneplus_12_v
          - oneplus_13r
          - oneplus_ace3_pro
          - oneplus_ace3_pro_v
          - oneplus_pad2_v
          - oneplus_pad_pro
          - oneplus_pad_pro_v
          - oneplus_nord_n30_se_5g_v
          - oneplus_10r_v
          - oneplus_nord_3_b
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_b
          - oneplus_pad_mt6983_b
          - oneplus_ace_2v_b
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_n6_b
          - oneplus_n6x_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_turbo_6x_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_ce6
          - oneplus_nord_ce6_lite_b
          - oneplus_turbo_6v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_b
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_ace5
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_15r
          - oneplus_15
          - oneplus_15t
          - oneplus_pad_3_pro
          - oneplus_pad_4
          - oneplus_ace6_ultra
          # 下面几行是拿 device_matrix.js 对着 OnePlusOSS/kernel_manifest 全分支比对后补的缺口。
          # 两条 JiuGeFaCai_ 的是第三方 ROM 变体：XML 文件名就带这个前缀，而 workflow 是按
          # raw.githubusercontent.com/.../${FILE}.xml 精确取的，所以选项必须连前缀一起写。
          # 最后三台是 6.1 线上原来没有裸名/_v 变体的机型（oneplus_nord_5 上游已有，不重复加）。
          - JiuGeFaCai_oneplus_13_v
          - JiuGeFaCai_oneplus_ace5_pro_v
          - oneplus_nord_4_v
          - oneplus_ace_3v_v
          - oneplus_nord_ce4_lite_5g_v
          # 下面 6 台是 MTK 线补进来的：OnePlusOSS/kernel_manifest 只有 13 条高通分支，
          # MTK 的分支在 Numbersf/kernel_manifest（oneplus/mt6789…mt6993），矩阵当初没枚举到。
          # 其中 ace5_ultra 是 mt6991、有风驰补丁；ace6_ultra_Canary / pad_lite_Canary_b 是 6.12。
          - oneplus_ace5_race
          - oneplus_ace5_ultra
          - oneplus_ace6_ultra_Canary
          - oneplus_nord_ce5_v
          - oneplus_pad_lite_Canary_b
          - oneplus_pad_mt6897_v
          # 这 6 台是把两个 manifest 仓全量枚举后又找到的 6.12 机型（Canary 通道变体）
          - oneplus_15_Canary
          - oneplus_15t_Canary
          - oneplus_15r_Canary
          - oneplus_ace_6t_Canary
          - oneplus_pad_3_pro_Canary
          - oneplus_pad_4_Canary
      SUSFS_CI:
        type: choice
        description: "SUSFS模块下载调用方向//SUSFS module branch"
        required: true
        default: N/A
        options:
          - CI
          - Release
          - N/A
      KPM:
        type: choice
        description: "内核模块实现方式//Kernel module implementation method"
        required: true
        default: KPM
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "回退SUSFS(输入哈希或次数或-1关闭)//Rollback SUSFS (Enter commit hash, count, or -1 to disable)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "动态清单仓库所有者//Manifest repository owner"
        required: true
        default: "Numbersf"
      BUILD_TIME:
        type: string
        description: "自定义构建时间(输入F使用UTCT或-1关闭)//Custom build time (Enter F to use UTCT, or -1 to disable)"
        required: false
        default: "Wed Jul 15 11:18:49 UTC 2026"
      KSU_META:
        type: string
        description: "管理器分支名(必填)/内置分支名(必填)/自定义版本标识(留空不修改)/回退分支提交哈希版本(留空不修改)//Manager Branch name (Required) / Builtin branch name (Required) / Custom version identifier (Leave blank to not modify) / Rollback branch commit hash version (Leave blank to not modify)"
        required: false
        default: "main/builtin/Numbersf/"
      LZ4_UPDATE:
        type: boolean
        description: "是否升级LZ4到上游最新？//Upgrade LZ4 to the latest upstream?"
        required: true
        default: false
      ZRAM:
        type: string
        description: "ZRAM(0关闭1开启)/算法名/大小//ZRAM (0: disable, 1: enable) / Algorithm name / Size"
        required: true
        default: "0/lz4kd/8589934592"
      SUFFIX:
        type: string
        description: "自定义内核后缀(不输入使用RAND_STR或-1关闭)//Custom kernel suffix (Leave blank to use RAND_STR, or -1 to disable)"
        required: false
        default: ""
      RESUBLEVEL:
        description: "自定义内核等级欺骗(SUBLEVEL)//Custom kernel SUBLEVEL spoofing"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？//Enable ultra-fast build?"
        required: true
        default: true
      LSM_BBG:
        type: boolean
        description: "是否启用关键分区写入保护模块(BBG)？//Enable critical partition write protection module (BBG)?"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "是否启用网络功能拓展(NETFILTER)？//Enable network feature extensions (NETFILTER)?"
        required: true
        default: true
      CCM:
        type: boolean
        description: "是否启用网络拥塞控制与管理机制(BBRv1+BBRv3+ECN)？//Enable network congestion control and management mechanism (BBRv1+BBRv3+ECN)?"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "是否添加Unicode不可见字码点绕过读取漏洞修复？//Add patch for Unicode invisible code point read bypass vulnerability?"
        required: true
        default: false
      SCHED_HMBIRD:
        type: boolean
        description: "是否添加风驰驱动1.0？//Add Fengchi (HMBIRD) Driver 1.0?"
        required: true
        default: false
      DROID_SPACES:
        type: boolean
        description: "是否添加轻量级Linux容器支持(DroidSpaces)？//Add lightweight Linux container support (DroidSpaces)?"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？//Add Re-Kernel?"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "是否拉取SUSFS-DEV分支？//Pull the SUSFS-DEV branch?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "是否停用空间清扫？//Disable workspace cleaning?"
        required: true
        default: false
      BUILD_NOCACHE:
        type: boolean
        description: "是否停用此次缓存？//Disable caching for this build?"
        required: true
        default: false
      HMBIRD_PATCH:
        type: string
        description: "sed -E 表达式，应用于 PATCH_TARGET 指定的源码文件（留空=不改）//sed -E expression applied to PATCH_TARGET"
        required: false
        default: ""
      PATCH_TARGET:
        type: string
        description: "改码目标路径片段（find -path 匹配）//path fragment for find -path"
        required: false
        default: "*vendor/oplus/kernel/cpu/sched_ext/main.c"

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ contains(github.event.inputs.FILE, '_aosp') && ' [AOSP]' || '' }}${{ github.event.inputs.KPM == 'KPM' && ' [KPM]' || github.event.inputs.KPM == 'KPN' && ' [KPN]' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && ' [BBG]' || '' }}${{ github.event.inputs.SCHED_HMBIRD == 'true' && ' [HMBIRD]' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && ' [DS]' || '' }}${{ startsWith(github.event.inputs.ZRAM, '1/') && ' [ZRAM]' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && ' [REKER]' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && ' [LZ4UPD]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        env:
          ROOT_RESERVE_MB: '8192'
          TEMP_RESERVE_MB: '2048'
          REMOVE_DOTNET: 'true'
          REMOVE_ANDROID: 'true'
          REMOVE_HASKELL: 'true'
          REMOVE_CODEQL: 'true'
        run: bash scripts/maximize-build-space.sh

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/Numbersf/Action-Build.git -b SukiSU-Ultra

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          # 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix
          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["OnePlusOSS"]="OnePlusOSS|kernel_manifest"
          REPOS["Dynamic"]="${DYNAMIC_REPO_INPUT}|kernel_manifest"
          REPOS["Appendix"]="Numbersf|Kernel_Manifest_Appendix"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}

            echo "🌐 尝试拉取 ${OWNER}/${REPO_NAME} 分支列表..."
            BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')

            if [[ -z "$BRANCHES" ]]; then
              echo "⚠️ ${OWNER}/${REPO_NAME} 分支列表获取失败，请尝试重新运行工作流。"
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"

              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "✅ 在 ${OWNER}/${REPO_NAME} 找到 ${FILE}.xml (分支: ${BRANCH})"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true

                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"

                return 0
              fi
            done
            return 1
          }
          if ! check_repo "${REPOS["OnePlusOSS"]}"; then
            if ! check_repo "${REPOS["Dynamic"]}"; then
              check_repo "${REPOS["Appendix"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法在任何仓库中找到 ${FILE}.xml"
            exit 8
          fi
          # 布局闸门：本流水线整条链是按 GKI 双仓布局写的 —— KMI 从
          # kernel_platform/common 的 build.config 取、susfs/KernelSU 补丁与 defconfig
          # 全在 kernel_platform/common 里操作，SukiSU 的 setup.sh 也只认
          # \$GKI_ROOT/common/drivers 或 \$GKI_ROOT/drivers。
          # 实测 MTK 那 17 台（mt6789/mt6833/mt6878/mt6897/mt6989/mt6991/mt6993）的
          # manifest 里**根本没有 kernel_platform/common**，内核是单仓
          # path="kernel-6.6" 这种布局 —— 继续跑的结果不是报错，而是
          # setup.sh 找不到 drivers/ 就静默不接 KernelSU，烧完 30-40 分钟产出一个
          # 没有 SU/SUSFS 的"看起来成功"的包。所以在这里当场停下，并说清缺什么。
          # 布局自适应。实测本流水线有 6 处**无条件**步骤直接 `cd kernel_platform/common`
          # （含 Add Configuration Settings 与钉串那步），而 MTK 的 manifest 是单仓布局：
          # 内核在 path="kernel-6.6"，没有 kernel_platform/common。
          # 直接放过去 = Add Configuration Settings 在错的目录里改 defconfig，
          # 结果不是报错而是 CONFIG_KSU_SUSFS_* 一条都没落地——隐藏性归零的"成功包"。
          # 所以：双仓就照常走；单仓就软链 kernel_platform/common -> ../kernel-<ver>，
          # 让所有 common 路径指向真正的内核树（SukiSU setup.sh 找的
          # $GKI_ROOT/common/drivers 也随之成立）；两种都没有才停，并说明查过哪里。
          if ! grep -q 'path="kernel_platform/common"' "$XML_PATH"; then
            KPATH=$(grep -o 'path="kernel-[0-9.]*"' "$XML_PATH" | head -n 1 | sed 's/path="//; s/"$//')
            if [ -z "$KPATH" ]; then
              echo "::error::这台机型的 manifest 既没有 kernel_platform/common，也没有单仓 kernel-<ver> 布局，流水线无法定位内核目录"
              echo "UNKNOWN_LAYOUT: ${FILE}"
              exit 9
            fi
            echo "SINGLE_TREE_LAYOUT: 内核在 ${KPATH}，建软链 kernel_platform/common -> ../${KPATH}"
            echo "SINGLE_TREE_DIR=$KPATH" >> "$GITHUB_ENV"
          else
            echo "DUAL_TREE_LAYOUT: 标准 GKI 双仓（kernel_platform/common 存在）"
            echo "SINGLE_TREE_DIR=" >> "$GITHUB_ENV"
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"

          # 解析 revision 字符串
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "解析 FILE 获取 CPU 和 ANDROID_VERSION..."
          # 提取 CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取 ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d+\.\d+(\.\d+)?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # 获取短位 Android 版本号
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            exit 1
          fi

          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ README.md 中未找到构建命令"
            fi
          else
            echo "❌ README.md 下载失败或为空"
          fi

          # 传递组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        env:
          BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
          SUFFIX: ${{ github.event.inputs.SUFFIX }}
        run: |
          echo "------------------------------"

          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          if [ "${{ github.event.inputs.SUSFS_CI }}" != "N/A" ]; then
            echo "::warning title=SUSFS Not Required::当前管理器已自带附加模块，无需启用 SUSFS 模块，强制启用可能导致不开机。"
          fi
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}"
          echo "Selected CCM: ${{ github.event.inputs.CCM }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}"
          echo "Selected LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}"
          echo "Custom BUILD_TIME: $BUILD_TIME"
          echo -n "BUILD_TIME Unicode: "
          CHECK_TEXT="$BUILD_TIME" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode build_time
          echo "Custom SUFFIX: $SUFFIX"
          echo -n "SUFFIX Unicode: "
          CHECK_TEXT="$SUFFIX" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode suffix

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Fork Check
        run: |
          repo="${{ github.repository }}"; json=$(curl -s "https://api.github.com/repos/$repo")
          parent=$(echo "$json" | grep -o '"full_name": *"[^"]*"' | head -n 2 | tail -n 1 | sed 's/.*"full_name": *"\([^"]*\)".*/\1/')
          if [ -n "$parent" ] && [ "$parent" != "Numbersf/Action-Build" ]; then
            echo "::warning title=Source Warning::您使用的内核编译地址为非官方源，可能导致运行失败或内核异常。"
          fi

      - name: Reject Check
        run: |
          REJ_CHECKER="$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_rejects.sh"
          chmod +x "$REJ_CHECKER"
          echo "REJ_CHECKER=$REJ_CHECKER" >> $GITHUB_ENV

      - name: Restore APT Cache
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/.apt-pkg-cache
          key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v6

      - name: Install Dependencies
        run: |
          export APT_PACKAGES="python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev lz4 zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"
          bash "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache

      - name: Setup Kotlin
        run: |
          KOTLIN_VERSION="2.4.10"
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlinc.zip
          unzip -q kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Setup Ccache-ECS
        run: |
         LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"
         sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-17.0

      - name: Restore ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' }}
        id: restore-thinlto
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-17.0

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"

          echo "使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          sed -i -e '/prebuilts\/asuite"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' -e '/tools\/tradefederation\/prebuilts"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' ".repo/manifests/${FILE}.xml"
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          # 单仓布局（MTK）在这里接上：kernel_platform/common -> ../kernel-<ver>。
          # 只有接上并且接对了才继续 —— 后面有 6 处无条件步骤直接 cd kernel_platform/common
          # 改 defconfig / 钉版本串，接错就等于 SUSFS 与钉串静默落空。
          # 所以接完立刻验：Makefile 与 drivers/ 必须真的透过这条软链可见。
          if [ -n "${SINGLE_TREE_DIR:-}" ]; then
            echo "单仓布局：建软链 kernel_platform/common -> ../$SINGLE_TREE_DIR"
            mkdir -p kernel_platform
            rm -rf kernel_platform/common
            ln -sfn "../$SINGLE_TREE_DIR" kernel_platform/common
            [ -f kernel_platform/common/Makefile ] || { echo "::error::软链接过去了但 kernel_platform/common/Makefile 不可见（$SINGLE_TREE_DIR 里没有内核？）"; exit 1; }
            [ -d kernel_platform/common/drivers ] || { echo "::error::软链接过去了但 drivers/ 不可见，KernelSU setup.sh 会找不到落点"; exit 1; }
            echo "✅ 单仓布局已接上：$(grep -m1 '^VERSION' kernel_platform/common/Makefile | tr -d '\n') $(grep -m1 '^PATCHLEVEL' kernel_platform/common/Makefile | tr -d '\n')"
          fi

          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi

          # 移除 ABI 保护
          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

          # 移除构建审查
          if grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then
            sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki
          fi
          if grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl; then
            sed -i 's/check_defconfig = None,/check_defconfig = "disabled",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
            sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
          fi

      - name: Load device profile
        run: |
          # workflow_dispatch 最多 25 个输入，而我们已经用到 24 个 —— 所以每台机型的
          # 「原厂 uname -r」和「闸门机型白名单」不再做成输入，改成仓库里的一张表：
          #   scripts/device-profiles.txt  每行  FILE|原厂串|机型白名单
          # 表里没有的机型 = 不钉串 + 只按 SoC/安卓版本拦（宁保守也不误钉）。
          set -e
          cd "$GITHUB_WORKSPACE"
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/device-profiles.txt"
          if curl -fsSL "$URL" -o devprofiles.txt; then
            echo "机型档案已取回：$(grep -c '' devprofiles.txt) 行"
          else
            echo "::warning::取不到机型档案（$URL），本轮按不钉串、不加机型白名单处理"
            : > devprofiles.txt
          fi
          LINE=$(grep -m1 "^${{ github.event.inputs.FILE }}|" devprofiles.txt || true)
          # 必须用 -f2 / -f3（单字段），不能写 -f2- / -f3-。
          # run 41543042993 就是栽在这里：-f2- 把第 2、3 列一起捞出并带上分隔符，
          # STOCK_UTS 变成「6.1.118-…e346|OP5D2BL1 PKG110」，钉串步骤拿它自比当然通过，
          # 但这条串随后进了内核的 $(shell …)，'|' 被 dash 当成管道 ——
          # 编译到 UPD include/generated/uapi/linux/version.h 之后直接
          # /bin/sh: 1: OP5D2BL1: not found，整个构建 Error 2。
          SU=$(printf '%s' "$LINE" | cut -d'|' -f2)
          GD=$(printf '%s' "$LINE" | cut -d'|' -f3)
          # 钉串会原样进 UTS_RELEASE，所以只允许 uname -r 里能出现的字符；
          # 有空格、竖线、引号就让它在第一步炸掉，别浪费三十分钟编译再炸。
          # （不能用 case + [!…  ]：模式里有空格会被当成 token 结束，dash 直接语法错误）
          if printf '%s' "$SU" | grep -q '[^A-Za-z0-9._+-]'; then
            echo "::error::机型档案第 2 列含非法字符：[$SU]（只许字母数字点横线下划线）"; exit 1
          fi
          if printf '%s' "$GD" | grep -q '[^A-Za-z0-9._ -]'; then
            echo "::error::机型档案第 3 列含非法字符：[$GD]（只许字母数字点横线下划线和空格）"; exit 1
          fi
          echo "STOCK_UTS=$SU" >> "$GITHUB_ENV"
          echo "GUARD_DEVICES=$GD" >> "$GITHUB_ENV"
          echo "本次 FILE=${{ github.event.inputs.FILE }} 钉串=[$SU] 白名单=[$GD]"
          if [ -z "$SU" ]; then echo "PIN_PLAN: 无原厂串，本轮不钉版本串"; else echo "PIN_PLAN: 钉成 $SU"; fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION 2位)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              KMI=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$KMI" ] && break
            fi
          done
          if [[ -z "$KMI" && -n "$KERNEL_REPOS" ]]; then
            KMI=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$KMI" ]; then
            echo "KMI=$KMI" >> $GITHUB_ENV
            echo "KANDROID_VERSION=${KMI%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${KMI#*-}" >> $GITHUB_ENV
          else
            echo "No KMI found in build.config* and ACK_SHA files"
          fi

          # 从 Makefile 获取完整内核版本号 (CD) 并拆分
          VERSIONLEVEL=$(awk '/^VERSION =/ {print $3}' ./common/Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' ./common/Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' ./common/Makefile)
          echo "VERSIONLEVEL=$VERSIONLEVEL" >> $GITHUB_ENV
          echo "PATCHLEVEL=$PATCHLEVEL" >> $GITHUB_ENV
          # SUBLEVEL 仅传递修改前的值，因为伪装并不影响原源码状态
          echo "SUBLEVEL=$SUBLEVEL" >> $GITHUB_ENV
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改 SUBLEVEL (内核等级)
          RESUBLEVEL="${{ github.event.inputs.RESUBLEVEL }}"
          if [ -n "$RESUBLEVEL" ]; then
            echo "修改 SUBLEVEL 为 $RESUBLEVEL"
            sed -i "s/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = $RESUBLEVEL/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi

          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          # CKERNEL_VERSION(3位)：被修改之后或者未经过修改的完整内核版本号，用于欺骗系统
          # DKERNEL_VERSION(3位)：被修改之前的完整内核版本号，真实值
          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "CKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "DKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "CKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # 内核版本的数字转换，仅前两位不包含 SUBLEVEL
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 从 build.config.constants 读取 RUSTC_VERSION
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "✅ RUSTC_VERSION(原始)=$RUSTC_VERSION"
            RUSTC_DIR_VERSION=$(echo "$RUSTC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [[ -z "$RUSTC_DIR_VERSION" ]]; then
              RUSTC_DIR_VERSION="$RUSTC_VERSION"
            fi
            echo "✅ RUSTC_DIR_VERSION(用于目录匹配)=$RUSTC_DIR_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "RUSTC_DIR_VERSION=$RUSTC_DIR_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "✅ RUSTC_VERSION 未找到，Rust 编译已禁用"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      # 自定义内核后缀
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.SUFFIX != '' && github.event.inputs.SUFFIX != '-1' }}
        run: |
          cd kernel_workspace/kernel_platform
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      # 伪官方格式的随机后缀（仅在 SUFFIX 未设置时生效）*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace/kernel_platform
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          KSU_META="${{ github.event.inputs.KSU_META }}"

          # 必须包含两个分隔符（至少四个字段）
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 3 ]]; then
            echo "错误: KSU_META 参数缺少必要的分隔符 '/'，格式应为: 管理器分支名/内置分支名/自定义标识(可省略)/提交hash(可省略)"
            exit 10
          fi

          # 解析字段：分支 / 自定义标识 / 手动 hash
          IFS='/' read -r KSU_MANAGER_BRANCH KSU_BUILTIN_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          echo "KSU_MANAGER_BRANCH=$KSU_MANAGER_BRANCH" >> $GITHUB_ENV
          echo "KSU_BUILTIN_BRANCH=$KSU_BUILTIN_BRANCH" >> $GITHUB_ENV
          [[ -n "$KSU_CUSTOM_TAG" ]] && echo "自定义版本标识: $KSU_CUSTOM_TAG" || echo "自定义版本标识: 未启用"
          [[ -n "$MANUAL_HASH" ]] && echo "手动指定 hash: $MANUAL_HASH" || echo "手动指定 hash: 未启用"

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${KSU_MANAGER_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BUILTIN_BRANCH"
          cd ./KernelSU

          # 如果指定了手动 hash，就切换到该提交
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$KSU_BUILTIN_BRANCH" --depth=50
            git checkout "$MANUAL_HASH"
            SHORT_HASH=${MANUAL_HASH:0:8}
          fi

          KSU_VERSION_TAG=$(curl -fsSL https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest \
            | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          if [[ -z "$KSU_VERSION_TAG" || "$(printf '%s\n' "$KSU_VERSION_TAG" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
            KSU_VERSION_TAG="3.1.7"
          fi
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> $GITHUB_ENV

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "GIT_HASH=$GIT_HASH"

          # 组装版本号
          if [[ -n "$MANUAL_HASH" ]]; then
            USE_HASH="$SHORT_HASH"
          else
            USE_HASH="$GIT_HASH"
          fi
          if [[ -z "$KSU_CUSTOM_TAG" ]]; then
            VERSION_FULL="v$KSU_VERSION_TAG-$USE_HASH@$KSU_BUILTIN_BRANCH"
          else
            VERSION_FULL="v$KSU_VERSION_TAG-$KSU_CUSTOM_TAG@$KSU_BUILTIN_BRANCH[$USE_HASH]"
          fi

          ESC_VERSION_FULL=$(printf '%s' "$VERSION_FULL" | sed 's/[&|\\/]/\\&/g')
          ESC_KSU_VERSION_TAG=$(printf '%s' "$KSU_VERSION_TAG" | sed 's/[&|\\/]/\\&/g')

          if grep -q '^KSU_VERSION_FULL := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|" kernel/Makefile
          else
            awk -v full="$VERSION_FULL" '
              /^REPO_OWNER :=/ && !done {
                print
                print ""
                print "KSU_VERSION_FULL := " full
                done=1
                next
              }
              { print }
            ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile
          fi

          if grep -q '^KSU_VERSION_API := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_API := .*|KSU_VERSION_API := $ESC_KSU_VERSION_TAG|" kernel/Makefile
          fi

          KSU_VERSION=$(expr $(git rev-list --count "$KSU_MANAGER_BRANCH" 2>/dev/null || echo 13000) + 37185)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          echo "::group::最终 Makefile 中版本信息及部分调试结果预览"
          grep -nE '^(REPO_OWNER|REPO_NAME|REPO_BRANCH|KSU_VERSION_API|KSU_VERSION_FULL|VERSION_TAG|GIT_BIN|CURL_BIN)' kernel/Makefile
          echo "::endgroup::"

      - name: Fix KernelSU LSM registration for 6.12
        run: |
          # 6.12 起 security_add_hooks() 第三参数从 const char* 变成 const struct lsm_id*，
          # 上游 SukiSU 还传 "ksu"，编译直接 -Wincompatible-pointer-types（run 41663264213）。
          # 修法只在 >=6.12 分支传 &ksu_lsm_id，旧行留在一棵 #else 里，所以对 6.1/6.6 是无害改动。
          LSMDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          [ -d "$LSMDIR" ] || { echo "::error::找不到 kernel_platform，LSM 修复没法做"; exit 1; }
          FIX="/tmp/ksu_lsmid_fix.py"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/ksu_lsmid_fix.py" -o "$FIX" \
            || { echo "::error::取不到 ksu_lsmid_fix.py（本仓库 scripts/ 下）"; exit 1; }
          python3 "$FIX" "$LSMDIR" || exit 1
          echo "ksu_lsmid_fix完成"

      - name: Apply Patches SukiSU Ultra
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            if [ -n "$SUSFS_META" ]; then
              if [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
                git checkout HEAD~$SUSFS_META
              else
                git checkout "$SUSFS_META"
              fi
            else
              echo "SUSFS_META 为空，使用最新上游 SUSFS"
            fi
            cd ..
          fi
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
          fi
          if [ "${{ github.event.inputs.LZ4_UPDATE }}" = "true" ]; then
            git clone https://github.com/Numbersf/lz4_oplus.git
          fi
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在拉取susfs补丁"
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi

          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/SusfsCompat.kts" apply "$PWD"
          fi

          if [ "$KMI" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复内核版本为5.15.0~5.15.123仅支持旧版C库造成的一些bug"
            cp "${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/fix_5.15.legacy" ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch完成"
          fi

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在打susfs补丁"
            kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/SusfsContext.kts" "$PWD" "$PWD/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch"
            # SUSFS 补丁档位：**6.12 禁止 fuzz=3**。
            # 实测（run 41588625844）fuzz=3 虽然 dry-run"零 reject"，但它把
            # fs/proc/task_mmu.c 里 show_smap / show_smaps_rollup 的 SUS_MAP 钩子
            # 按容差塞进了错误上下文，编译直接死：
            #   ../fs/proc/task_mmu.c:1516: error: use of undeclared identifier 'vma'
            # 老注释里"8/8、4/4 全部干净应用"是错的（那份源码和真树不是同一份）。
            # 现在的策略：只试 0 与 2；仍失败就按 0 打（留下 .rej 让闸门点名），
            # 然后由下面的 6.12 专用适配器**按真文件结构**补那两处钩子。
            SUSFS_PATCH="50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch"
            SUSFS_FUZZ=""
            for FZ in 0 2; do
              if patch -p1 --dry-run -F "$FZ" < "$SUSFS_PATCH" >/dev/null 2>&1; then
                SUSFS_FUZZ="$FZ"; break
              fi
            done
            if [ -n "$SUSFS_FUZZ" ]; then
              echo "SUSFS 补丁按 fuzz=$SUSFS_FUZZ 应用（不高于 2）"
              patch -p1 -F "$SUSFS_FUZZ" < "$SUSFS_PATCH" || true
            else
              echo "::warning::fuzz=0/2 都有 reject，按 fuzz=0 应用，剩余由 6.12 适配器与闸门处理"
              patch -p1 -F 0 < "$SUSFS_PATCH" || true
            fi

            if [ "${KANDROID_VERSION}-${KERNEL_VERSION}" = "android16-6.12" ]; then
              # 6.12 适配器：show_smap / show_smaps_rollup 的 SUS_MAP 钩子补丁是按 do{}while 写的，
              # 真树用 for_each_vma，fuzz<=2 必然打不上、fuzz=3 会塞错位置（已实测编译失败）。
              # 脚本在本仓库 scripts/ 下，按本次 SHA 取回执行；不能读 kernel_workspace 里那份
              # （那是 Numbersf 的克隆，没有这个文件）。
              ADAPTER="/tmp/susfs612_adapter.py"
              URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/susfs612_adapter.py"
              curl -fsSL "$URL" -o "$ADAPTER" || { echo "::error::取不到 susfs612_adapter.py（本仓库 scripts/ 下）"; exit 1; }
              python3 "$ADAPTER" .
              echo "6.12 钩子适配完成"
            fi

            # 打完当场核一遍：还有 .rej 就点名（不等到编译失败再回头猜）
            LEFT=$(find fs kernel mm security -name '*.rej' 2>/dev/null | head -5)
            if [ -n "$LEFT" ]; then
              echo "::warning::SUSFS 补丁仍留下 .rej：$(echo $LEFT | tr '\n' ' ')"
            else
              echo "SUSFS 补丁应用后无 .rej"
            fi
            echo "susfs_patch完成"
          fi
          source $REJ_CHECKER
          check_rejects .

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/SusfsCompat.kts" postfix "$PWD"
            kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/SusfsCompat.kts" revert "$PWD"
          fi

      - name: Repair rejected SUSFS include hunks
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          # run 41543246097（oneplus_15，android16-6.12 线）报
          #   fs/exec.c:1949: error: call to undeclared function 'susfs_is_current_proc_no_su'
          # 同一份日志里还有 "1 out of 4 hunks FAILED -- saving rejects to file fs/exec.c.rej"：
          # 失败的那一 hunk 正是补丁给 exec.c 加的 `#include <linux/susfs_def.h>`。
          # 调用点全打上了、头没进去 → C99 把隐式声明当错误；而补丁是 `|| true` 应用所以不拦。
          # 6.1/6.6 上不报，是因为那两个分支的 exec.c 上下文刚好能对上 —— 所以这是
          # "按 KMI 线各跑一遍才知道"的坑，不是通用结论。
          # 做法：按补丁原文取出"它给哪些文件加过 susfs 头"，逐文件核对，缺就插到该文件
          # 最后一条 #include 之后；修完再硬断一次"调用 no_su 却没头"的文件必须为 0。
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          PATCH="50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ ! -f "$PATCH" ]; then echo "本轮没有 $PATCH（SUSFS 关闭？），跳过 include 修复"; exit 0; fi
          CUR=""; FIXED=0; SEEN=0
          while IFS= read -r line; do
            case "$line" in
              'diff --git a/'*) CUR=$(printf '%s' "$line" | sed -E 's|^diff --git a/[^ ]+ b/||') ;;
            esac
            case "$line" in
              '+#include <linux/susfs'*)
                H=$(printf '%s' "$line" | sed -E 's/^\+//')
                [ -n "$CUR" ] || continue
                [ -f "$CUR" ] || { echo "  补丁要改的文件不在树里，跳过: $CUR"; continue; }
                SEEN=$((SEEN+1))
                if grep -qF "$H" "$CUR"; then continue; fi
                LN=$(grep -n '^#include' "$CUR" | tail -1 | cut -d: -f1)
                if [ -z "$LN" ]; then LN=0; fi
                { head -n "$LN" "$CUR"; printf '%s\n' "$H"; tail -n +"$((LN+1))" "$CUR"; } > "$CUR.akfix"
                mv "$CUR.akfix" "$CUR"
                grep -qF "$H" "$CUR" || { echo "::error::插完又找不到 $H（$CUR）"; exit 1; }
                echo "  补回 include: $CUR ← $H（原第 $LN 行后）"
                FIXED=$((FIXED+1))
                ;;
            esac
          done < "$PATCH"
          echo "SUSFS include 核对 $SEEN 处，实际补回 $FIXED 处"
          BAD=""
          for F in $(grep -rlE 'susfs_(is|set|clear)_current_proc_no_su' --include='*.c' . --exclude-dir=out --exclude-dir=.git 2>/dev/null); do
            # susfs.h 自己 include 了 susfs_def.h，所以两个头任一在场都算有声明
            grep -qE '#include <linux/susfs(_def)?\.h>' "$F" || BAD="$BAD $F"
          done
          [ -z "$BAD" ] || { echo "::error::这些文件调用 no_su 却没有 include susfs 头：$BAD"; exit 1; }
          # 已经人工修好的 .rej 清掉，别让后面的 reject 检查把"修好了"当成"还没修"
          for R in $(find . -maxdepth 3 -name '*.c.rej' 2>/dev/null); do
            B=$(basename "$R" .rej)
            if grep -q 'susfs' "$R" && grep -q 'include <linux/susfs' "$R"; then
              rm -f "$R"; echo "  清掉已修复的 $R"
            fi
          done
          echo "✅ SUSFS include 修复与硬断通过（这条线现在能编）"

      # OGKI转换GKI，无需修改 dtbo 开机
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ (fromJSON(env.VERSIONLEVEL) > 6 || (fromJSON(env.VERSIONLEVEL) == 6 && fromJSON(env.PATCHLEVEL) >= 6) || github.event.inputs.FORCE_DTFLIP == 'true') && github.event.inputs.SCHED_HMBIRD == 'false' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "正在打OGKI转换GKI补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
          echo "OGKI转换GKI_patch完成"
          source $REJ_CHECKER
          check_rejects .

      - name: Apply BBRv3
        if: ${{ github.event.inputs.CCM == 'true' && env.KMI != 'android16-6.12' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          patch -p1 < "${PATCH_DIR}/bbrv3/0001-net-tcp-backport-BBRv3-to-$KMI.patch"
          if [ "$KMI" = "android12-5.10" ]; then
            if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
              patch -p1 < "${PATCH_DIR}/bbrv3/sysctl_add_proc_dou8vec_minmax.patch"
              patch -p1 < "${PATCH_DIR}/bbrv3/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
            fi
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "$VERSIONLEVEL" -lt 6 ]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp -r "${RE_DIR}"/* drivers/rekernel/
          if [ -f BUILD.bazel ]; then
            sed -i '0,/name = "kernel_aarch64",/{/module_implicit_outs/s|,$| + ["drivers/rekernel/rekernel.ko"],|}' BUILD.bazel
          fi

      - name: Apply DROID_SPACES
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          # 注释掉原始的 sysv 结构体定义
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' include/linux/sched.h
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' include/linux/sched.h

          if [ "$KMI" = "android12-5.10" ]; then
            echo "为 android12-5.10 修复 sysvipc KABI 绕过及 POSIX_MQUEUE ABI 填充问题..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' include/linux/sched.h
            sed -i 's/^\tunsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue[?] \*\//\t\/\/unsigned long mq_bytes;\t\/* How many bytes can be allocated to mqueue? *\//' include/linux/sched/user.h
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' include/linux/sched/user.h
          # 检查 sched.h 并修改 KABI 槽位或指针
          elif grep -q "sched_dl_entity.*\*dl_server" include/linux/sched.h; then
            echo "✅ 检测到 dl_server 指针，使用 packed union 方案"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' include/linux/sched.h
          elif grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then
            echo "✅ 检测到 USE(1)，使用槽位 6,7,8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ 检测到 RESERVE(1)，使用槽位 1,2,3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback，使用槽位 3,4,5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h
          else
            echo "❌ 无法通过上下文精准匹配 KABI 槽位或对应指针"
            exit 9
          fi

          echo "为 oplus_bsp_midas 模块返回幽灵任务以避免空指针崩溃..."
          patch -p1 --forward < "${PATCH_DIR}/ghost-task-for-midas.patch" || true

          if [ "$KMI" = "android16-6.12" ]; then
            rm -f include/uapi/linux/ntsync.h
            rm -f drivers/misc/ntsync.c
            echo "补全 IPC NS 符号导出..."
            if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' ./ipc/namespace.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> ./ipc/namespace.c
            fi
            if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' ./ipc/msgutil.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> ./ipc/msgutil.c
            fi
          fi
          echo "拓展 ntsync 支持..."
          patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_base.patch" || true
          if [[ "$FILE" == oneplus_10r* ]]; then
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_android12-5.10_14.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_$([ -f "${PATCH_DIR}/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch" ] && echo "${KMI}_${ANDROID_SHORT_VERSION}" || echo "${KMI}").patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply LZ4_DEV
        if: ${{ github.event.inputs.LZ4_UPDATE == 'true' }}
        run: |
          set -euo pipefail
          LZ4_REPO="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"
          cd kernel_workspace/kernel_platform/common
          . "${LZ4_REPO}/apply_lz4_oplus.sh"

      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          if [[ "$(grep -o '/' <<< "$ZRAM" | wc -l)" -lt 2 ]]; then
            echo "错误: ZRAM 参数缺少必要的分隔符 '/'，格式应为: 总开关0关1开/算法名(前面输入0时无效)/大小(前面输入0时无效)"
            exit 10
          fi
          # 解析字段：开关状态 / 算法名 / 大小
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${ZRAM_ALGO^^}" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV

          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          if [[ "$KERNEL_VERSION" == "5.10" && "${CPU}" == mt* ]]; then
            sed -i 's/select CRYPTO_LZO/depends on CRYPTO_LZO/' ./mm/oplus_mm/hybridswap_zram/Kconfig
          fi
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo 'lz4kd_patch完成'
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          echo 'lz4k_oplus_patch完成'
          source $REJ_CHECKER
          check_rejects .

      - name: Apply SCHED_HMBIRD
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED_HMBIRD == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          CLEAN_FILE="${FILE//_bak/}"
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          # 风驰上游只开了 mt6991/sm8735/sm8750 三个分支，机型补丁也只有对应那批文件。
          # 以前不支持就 exit 11/12 把整条构建打死，现在改成明确跳过并打判定行。
          if ! git clone -q https://github.com/Numbersf/SCHED_PATCH.git -b "$CPU" 2>/dev/null; then
            echo "FENGCHI_SKIP: SCHED_PATCH 没有 $CPU 分支（现存 mt6991/sm8735/sm8750），本轮不带风驰继续构建"
            exit 0
          fi
          echo "正在拉取风驰补丁"
          # 这行原来没有容错：分支存在但这台机型没补丁时，cp 非 0 会直接打死整条构建，
          # 而下一行的 -f 判断本来就是为"没补丁"准备的。改成 || true 让它走到 FENGCHI_SKIP。
          cp ./SCHED_PATCH/fengchi_${CLEAN_FILE}.patch ./ || true
          if [[ -f "fengchi_${CLEAN_FILE}.patch" ]]; then
            echo "正在打风驰补丁"
            dos2unix "fengchi_${CLEAN_FILE}.patch"
            patch -p1 -F 3 < "fengchi_${CLEAN_FILE}.patch"
            echo "fengchi_patch完成"
            source $REJ_CHECKER
            check_rejects .
          else
            echo "FENGCHI_SKIP: 没有 fengchi_${CLEAN_FILE}.patch，本机未适配风驰，继续构建不带风驰"
            exit 0
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "正在启用内核级基带保护支持…"
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # 配置信息，带*为附加项目，具有一定危险性和不确定性
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          MAKEFILE=./kernel/Makefile

          declare -a HIDE_CONFIGS=()

          set_config() {
            local val="$1"
            local key="${val%%=*}"
            if grep -qF "${key}=" "$CONFIG_FILE" || grep -qF "# ${key} is not set" "$CONFIG_FILE"; then
              VAL="$val" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 { print ENVIRON["VAL"]; next }
                { print }
              ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE" || rm -f "${CONFIG_FILE}.tmp"
            else
              printf '%s\n' "$val" >> "$CONFIG_FILE"
            fi
          }

          set_hide_config() {
            local val="$1"
            local key="${val%%=*}"
            set_config "$val"
            HIDE_CONFIGS+=("$key")
          }

          inject_fake_config() {
            [ "${#HIDE_CONFIGS[@]}" -eq 0 ] && return 0
            local marker="# --- fake_config injector ---"
            if ! grep -qF "$marker" "$MAKEFILE"; then
              {
                printf '\n%s\n' "$marker"
                printf 'ifneq ($(strip $(CONFIG_FAKE_DISABLE)),)\n'
                printf '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE\n'
                printf '\t$(Q)sed $(foreach opt,$(CONFIG_FAKE_DISABLE),-e '"'"'s|^$(opt)=.*|# $(opt) is not set|'"'"') $(KCONFIG_CONFIG) > $@\n'
                printf 'endif\n'
              } >> "$MAKEFILE"
            fi
            echo "CONFIG_FAKE_DISABLE=${HIDE_CONFIGS[*]}" >> "$GITHUB_ENV"
          }
          trap 'inject_fake_config' EXIT

          # SukiSU Ultra配置
          set_config "CONFIG_KSU=y"

          # KPM配置
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ] || [ "${{ github.event.inputs.KPM }}" = "N/A" ]; then
            set_config "CONFIG_KPM=y"
          fi
          if [ "${{ github.event.inputs.KPM }}" = "KPN" ]; then
            set_config "CONFIG_KPM=n"
          fi

          # SUSFS配置
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            # builtin 分支的 kernel/manager/pkg_observer.c:24/37 和 supercall/dispatch.c:478
            # 直接调 SUSFS v2.3.0 的优先级 UID 接口，可它自己的 Kconfig 没声明
            # KSU_SUSFS_PRIORITY_UID_FILTER —— 于是 susfs.h 里那两条声明被 #ifdef 关掉，
            # 调用点成了隐式声明，clang 当错误：
            #   error: call to undeclared function 'susfs_parse_priority_app_strings'
            # run 41545476210 / 41545481017 / 41545485898 三条全栽在这儿。
            # 按 SUSFS 上游 10_enable_susfs_for_ksu.patch 的原文把声明补进树里
            # （插在最后一个 endmenu 之前，仍在 KSU 菜单内），补完 olddefconfig 就不会
            # 再把它丢掉，优先级过滤也就真编进产物了。
            # run 41549928406 这四条死在这儿：我原来用
            #   grep -rl 'config KSU_SUSFS_SPOOF_UNAME' . --include=Kconfig
            # 去找声明文件，结果没命中。原因不是文件名，而是 **SukiSU 的 setup.sh
            # 把内核源码 clone 到 kernel_platform/KernelSU/，再在 drivers/ 下建一个
            # symlink 指过去** —— `grep -r` 与 `find -type f` 默认都不跟随符号链接，
            # 所以从 common/ 里搜永远搜不到。正解：先按 setup.sh 的真实布局直接认路径，
            # 再用 find -L / -R 跟随链接兜底。
            # setup.sh 的真相（实测读它 main 分支 15-59 行）：GKI_ROOT 有两种取法——
            #   有 common/drivers 时 GKI_ROOT=kernel_platform → KernelSU 落在 ../KernelSU
            #   否则 GKI_ROOT=common        → KernelSU 落在 ./KernelSU
            # 候选表以前只有 ../KernelSU，少了 ./KernelSU 这一支；6.6/6.12 那两条线
            # 的树形就是走不通才在 00:13 死在「找不到 Kconfig」（那条 run 用的还是更早的
            # grep -rl 版本，但候选表缺项是真的）。两种布局都列上，再让 find -L 兜底。
            KCFG=""
            for C in ../KernelSU/kernel/Kconfig ./KernelSU/kernel/Kconfig ./drivers/kernelsu/Kconfig ./drivers/KernelSU/Kconfig; do
              if [ -f "$C" ] && grep -q 'KSU_SUSFS' "$C"; then KCFG="$C"; break; fi
            done
            if [ -z "$KCFG" ]; then
              KCFG=$(find -L . -type f -name 'Kconfig*' 2>/dev/null | xargs -r grep -ls 'KSU_SUSFS_SPOOF_UNAME' 2>/dev/null | head -n 1)
            fi
            if [ -z "$KCFG" ]; then
              KCFG=$(grep -Rls 'KSU_SUSFS_SPOOF_UNAME' . 2>/dev/null | head -n 1)
            fi
            if [ -z "$KCFG" ]; then
              echo "--- 现场诊断：drivers 下的 kernelsu 到底是什么 ---"
              ls -l ./drivers/ 2>/dev/null | grep -aiE 'kernel|sus' | head -5
              echo "--- 现场诊断：上一层有没有 KernelSU 目录 ---"
              ls -d ../KernelSU 2>/dev/null && find -L ../KernelSU -maxdepth 2 -name 'Kconfig*' | head -5
              echo "::error::找不到声明 KSU_SUSFS_* 的 Kconfig，无法补优先级开关（见上面现场）"
              exit 1
            fi
            echo "KSU 的 Kconfig: $KCFG"
            echo "KSU_KCONFIG=$(cd "$(dirname "$KCFG")" && pwd)/$(basename "$KCFG")" >> "$GITHUB_ENV"
            if grep -q 'config KSU_SUSFS_PRIORITY_UID_FILTER' "$KCFG"; then
              echo "上游已自己声明优先级开关，不重复补"
            else
              # 插到最后一个 endmenu 之前（仍在 KSU 菜单里）。不用 awk BEGIN 里数行数：
              # BEGIN 阶段 FILENAME 还没赋值，那种写法取到的是空文件。
              LAST=$(grep -n '^endmenu' "$KCFG" | tail -1 | cut -d: -f1)
              [ -n "$LAST" ] || { echo "::error::$KCFG 里没有 endmenu，不知道往哪儿插优先级开关"; exit 1; }
              {
                head -n "$((LAST - 1))" "$KCFG"
                printf "config KSU_SUSFS_PRIORITY_UID_FILTER\n"
                printf "\tbool \"Enable to allow adding user-defined uids that will be hidden from getpriority/setpriority/ioprio_get/ioprio_set syscall\"\n"
                printf "\tdepends on KSU_SUSFS\n"
                printf "\tdefault y\n"
                printf "\thelp\n"
                printf "\t  - Allow hiding user-defined uids from syscalls like getpriority/setpriority/ioprio_get/ioprio_set.\n"
                printf "\t  - Effective on all processes with uid >= 10000.\n"
                printf "\n"
                tail -n +"$LAST" "$KCFG"
              } > "$KCFG.new"
              grep -q 'config KSU_SUSFS_PRIORITY_UID_FILTER' "$KCFG.new" || { echo "::error::优先级开关没补进去（Kconfig 结构变了）"; exit 1; }
              mv "$KCFG.new" "$KCFG"
              echo "✅ 已补声明 KSU_SUSFS_PRIORITY_UID_FILTER（default y, depends on KSU_SUSFS）"
            fi
            set_config "CONFIG_KSU_SUSFS=y"
            set_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            set_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            # ENABLE_LOG 是我们**故意唯一关掉**的一个：
            #   fs/susfs.c 里是 DEFINE_STATIC_KEY_TRUE(susfs_is_log_enabled) —— 键默认就是"开"，
            #   而模块 service.sh 只在 susfs_log=1 时调 enable_log 1，**从不调 enable_log 0**。
            #   所以只要把 ENABLE_LOG 编成 y，内核从 susfs_init 起就往 kmsg 打
            #   "susfs:[uid][pid][函数名] ..."，改 config.sh 也拧不动（行已经进了环形缓冲）。
            #   编成 n 之后 SUSFS_LOGI/LOGE 整个宏变成空（susfs.c 第 44-45 行），运行时零日志面，
            #   dispatch.c 的 CMD_SUSFS_ENABLE_LOG 分支也被 #ifdef 包着，不会隐式声明。
            #   代价：管理器里那个"内核日志"开关失效 —— 对隐藏来说这正是想要的。
            set_config "CONFIG_KSU_SUSFS_ENABLE_LOG=n"
            set_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            set_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            # v2.3.0 一共定义了 11 个 KSU_SUSFS_* 开关，但这条多出来的
            # KSU_SUSFS_PRIORITY_UID_FILTER 只有 tiann/KernelSU 那条线声明（在 SUSFS 的
            # 10_enable_susfs_for_ksu.patch 里），SukiSU 的 kernel/Kconfig 里根本没有它
            # （builtin 分支实测只声明 10 个，含主开关）。Kconfig 不认识的名字，
            # olddefconfig 会静默丢掉 —— 所以照抄 SUSFS 文档硬开 11 个是自欺欺人。
            # 这里仍然写下去（哪天上游加了这个名字就自动生效），但断言改成
            # 「按上游 Kconfig 实际声明的集合来核」，并在产物闸门里点名它不可能出现。
            set_config "CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y"
          else
            set_config "CONFIG_KSU_SUSFS=n"
          fi

          # SUSFS 特性面硬断（学 WildKernels 的做法：取不到版本就不许出包）
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "=== SUSFS 版本与开关核对 ==="
            SH=$(find "$GITHUB_WORKSPACE" -type f -path "*/susfs4ksu/kernel_patches/include/linux/susfs.h" 2>/dev/null | head -n 1)
            [ -n "$SH" ] || SH=$(find "$GITHUB_WORKSPACE" -type f -name susfs.h 2>/dev/null | head -n 1)
            [ -n "$SH" ] || { echo "::error::找不到 susfs.h，无法确认 SUSFS 版本，拒绝继续"; exit 1; }
            SUSFS_VER=$(grep -m1 -oE 'define SUSFS_VERSION "[^"]+"' "$SH" | cut -d'"' -f2)
            [ -n "$SUSFS_VER" ] || { echo "::error::susfs.h 里没有 SUSFS_VERSION"; exit 1; }
            echo "SUSFS_VERSION=$SUSFS_VER  来源分支: gki-$KMI"
            MISSING=""
            DECL=""
            # 声明面就是刚才那个文件（同一步里已经定好了），别再猜路径
            grep -aoE '^config (KSU_SUSFS_[A-Z0-9_]+|KSU_SUSFS)' "$KCFG" | sed 's/^config //' | sort -u > /tmp/decl_list.txt
            echo "Kconfig 来源: $KCFG"
            DECL=$(cat /tmp/decl_list.txt)
            ND=$(printf '%s\n' "$DECL" | grep -c '')
            echo "上游声明的 SUSFS 开关: $ND 个 -> $(echo "$DECL" | tr '\n' ' ')"
            [ "$ND" -ge 9 ] || { echo "::error::只声明了 $ND 个 SUSFS 开关，比已知最少值还少，先查上游是否改了名"; exit 1; }
            for K in $DECL; do
              if [ "$K" = "KSU_SUSFS_ENABLE_LOG" ]; then
                # 这一个是我们主动关的（见上面注释），断言方向反过来
                grep -qE '^CONFIG_KSU_SUSFS_ENABLE_LOG=n$|^# CONFIG_KSU_SUSFS_ENABLE_LOG is not set$' "$CONFIG_FILE" \
                  || MISSING="$MISSING CONFIG_$K(应为 n)"
              else
                grep -qF "CONFIG_$K=y" "$CONFIG_FILE" || MISSING="$MISSING CONFIG_$K"
              fi
            done
            [ -z "$MISSING" ] || { echo "::error::以下 SUSFS 开关没到位：$MISSING"; exit 1; }
            echo "✅ 上游声明的 $ND 个 SUSFS 开关全部到位（ENABLE_LOG 主动设 n，其余 =y）"
            printf '%s\n' "$DECL" | grep -qx 'KSU_SUSFS_PRIORITY_UID_FILTER' \
              && echo "  这条线支持 PRIORITY_UID_FILTER（隐藏 getpriority/ioprio 探测）" \
              || echo "  注：这条线的上游 Kconfig 不声明 KSU_SUSFS_PRIORITY_UID_FILTER，优先级 UID 过滤不可能编进产物（只有 tiann/KernelSU 有），不算回归"
            echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
          fi

          # TMPFS配置*
          set_config "CONFIG_TMPFS_XATTR=y"
          set_config "CONFIG_TMPFS_POSIX_ACL=y"

          # BBR & ECN配置*
          if [ "${{ github.event.inputs.CCM }}" = "true" ]; then
            set_hide_config "CONFIG_TCP_CONG_ADVANCED=y"
            set_config "CONFIG_TCP_CONG_BBR=y"
            if [ "$KMI" != "android16-6.12" ]; then
              set_config "CONFIG_TCP_CONG_BBR3=y"
            fi
            set_config "CONFIG_NET_SCH_FQ=y"
            set_config "CONFIG_TCP_CONG_BIC=n"
            set_config "CONFIG_TCP_CONG_WESTWOOD=n"
            set_config "CONFIG_TCP_CONG_HTCP=n"
            set_config "CONFIG_IP_ECN=y"
            set_config "CONFIG_TCP_ECN=y"
            set_config "CONFIG_IPV6_ECN=y"
            set_config "CONFIG_IP_NF_TARGET_ECN=y"
          fi

          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            set_config "CONFIG_REKERNEL=y"
            set_config "CONFIG_REKERNEL_NETWORK=y"
          fi

          # ZRAM配置*
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            set_config "CONFIG_CRYPTO_LZ4HC=y"
            set_config "CONFIG_CRYPTO_LZ4K=y"
            set_config "CONFIG_CRYPTO_LZ4KD=y"
            set_config "CONFIG_CRYPTO_842=y"
            set_config "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            set_config "CONFIG_ZRAM_WRITEBACK=y"
          fi

          # LSM配置*
          if [ "${{ github.event.inputs.LSM_BBG }}" = "true" ]; then
            set_config "CONFIG_BBG=y"
          fi

          # DROID_SPACES配置*
          if [ "${{ github.event.inputs.DROID_SPACES }}" = "true" ]; then
            set_config "CONFIG_NTSYNC=y"
            set_config "CONFIG_MACVLAN=y"
            set_config "CONFIG_SYSVIPC=y"
            set_config "CONFIG_DEVTMPFS=y"
            set_config "CONFIG_PID_NS=y"
            set_config "CONFIG_IPC_NS=y"
            set_config "CONFIG_USER_NS=y"
            set_config "CONFIG_NAMESPACES=y"
            set_config "CONFIG_POSIX_MQUEUE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
          fi

          # IPSET & IPv6_NAT & TTL配置*
          if [ "${{ github.event.inputs.NETFILTER }}" = "true" ]; then
            if [[ "$KERNEL_VERSION" != "6.12" && "${CPU}" != mt* ]]; then
              set_config "CONFIG_BPF_STREAM_PARSER=y"
            fi
            set_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            set_config "CONFIG_NETFILTER_XT_SET=y"
            set_config "CONFIG_IP_SET=y"
            set_config "CONFIG_IP_SET_MAX=65534"
            set_config "CONFIG_IP_SET_BITMAP_IP=y"
            set_config "CONFIG_IP_SET_BITMAP_IPMAC=y"
            set_config "CONFIG_IP_SET_BITMAP_PORT=y"
            set_config "CONFIG_IP_SET_HASH_IP=y"
            set_config "CONFIG_IP_SET_HASH_IPMARK=y"
            set_config "CONFIG_IP_SET_HASH_IPPORT=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTIP=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_IPMAC=y"
            set_config "CONFIG_IP_SET_HASH_MAC=y"
            set_config "CONFIG_IP_SET_HASH_NETPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_NET=y"
            set_config "CONFIG_IP_SET_HASH_NETNET=y"
            set_config "CONFIG_IP_SET_HASH_NETPORT=y"
            set_config "CONFIG_IP_SET_HASH_NETIFACE=y"
            set_config "CONFIG_IP_SET_LIST_SET=y"
            set_hide_config "CONFIG_IP6_NF_NAT=y"
            set_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_HL=y"
            set_config "CONFIG_IP_NF_TARGET_TTL=y"
            set_config "CONFIG_IP6_NF_TARGET_HL=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MATCH_TTL=y"
            set_config "CONFIG_IP6_NF_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MANGLE=y"
            set_config "CONFIG_IP6_NF_MANGLE=y"
          fi

          # 构建依赖项调整及优化
          if [ "$KERNEL_VERSION" = "5.15" ] && [[ "$CPU" == mt* ]]; then
            set_config "CONFIG_OPLUS_SYSTEM_KERNEL=y"
            set_config "CONFIG_OPLUS_FEATURE_CMDLINE=m"
            set_config "CONFIG_OPLUS_FEATURE_OPLUSBOOT=m"
            set_config "CONFIG_OPLUS_FEATURE_BUILDVARIANT=m"
            set_config "CONFIG_OPLUS_FEATURE_OPROJECT=m"
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            set_config "CONFIG_RUST=y"
            set_config "CONFIG_ANDROID_BINDER_IPC_RUST=m"
          fi

      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in ./common/scripts/mkcompile_h ./"$KERNEL_REPOS"/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      - name: Fix libbpf for new glibc
        run: |
          cd kernel_workspace/kernel_platform/common
          f="./tools/lib/bpf/libbpf.c"
          if [ -f "$f" ]; then
            sed -i -E 's/(\bres = )strstr\(sym_name, "\.llvm\."\)/\1(char *)strstr(sym_name, ".llvm.")/' "$f"
            sed -i -E 's/(\bnext_path = )strchr\(s, '"'"':'"'"'\)/\1(char *)strchr(s, '"'"':'"'"')/' "$f"
            grep -nE '\(char \*\)(strstr|strchr)' "$f" || echo "✅ 匹配失败，当前云控ubuntu版本无需此操作"
          fi

      - name: Patch hmbird sched_ext source
        if: ${{ github.event.inputs.HMBIRD_PATCH != '' }}
        env:
          PATCH_EXPR: ${{ github.event.inputs.HMBIRD_PATCH }}
          PATCH_GLOB: ${{ github.event.inputs.PATCH_TARGET }}
        run: |
          set -e
          # sched_ext 属 modules_and_devicetree 仓库，manifest 里 path 是 "./"，
          # 不在 kernel_platform 下，所以从 kernel_workspace 整层找。
          cd kernel_workspace
          SRC=$(find . -type f -path "$PATCH_GLOB" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::warning::未找到匹配 $PATCH_GLOB 的源文件，跳过改码"
            find . -maxdepth 6 -type d -name 'sched_ext' 2>/dev/null | head -5
            exit 0
          fi
          echo "改码目标: $SRC"
          cp "$SRC" "$SRC.orig"
          # 经 env 传入而非直接插值，避免 workflow 表达式注入
          sed -i -E "$PATCH_EXPR" "$SRC"
          # sed 匹配不到时不会报错，必须显式判定「确实改动了」，
          # 否则会得到一个静默空转的假成功。
          if cmp -s "$SRC.orig" "$SRC"; then
            echo "::error::sed 未产生任何改动 —— 目标行可能已随上游变化，拒绝继续"
            grep -nE "use_vutil_threshold" "$SRC" | head -5
            exit 1
          fi
          echo "=== 实际改动 ==="
          diff -u "$SRC.orig" "$SRC" | head -40

      - name: Let unused SUSFS helpers compile
        run: |
          # 全量档（非 FAST）实测倒在 fs/susfs.o：
          #   error: unused function 'susfs_switch_to_ksu_domain' [-Werror,-Wunused-function]
          #   error: unused function 'susfs_restore_creds'        [-Werror,-Wunused-function]
          # 原因是配对：SUSFS 用最新版，而 SukiSU 为配对钉在 ce75122b。
          # 这两个 helper 是给更新版 SukiSU 调用的，钉住旧版后它们在本内核里确实没人调，
          # CONFIG_WERROR 把这条纯风格警告升级成编译失败。
          # 只对 fs/susfs.o 这一条警告降级：不关全局 WERROR，不删代码，
          # 其它文件、其它警告照旧硬断。
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          [ -f fs/susfs.c ] || { echo "::error::找不到 fs/susfs.c，SUSFS 没进来？"; exit 1; }
          if grep -q 'Wno-error=unused-function' fs/Makefile; then
            echo "fs/Makefile 已降级过，跳过（幂等）"
          else
            printf '\nCFLAGS_susfs.o += -Wno-error=unused-function\n' >> fs/Makefile
          fi
          grep -q 'CFLAGS_susfs.o' fs/Makefile || { echo "::error::没写进 fs/Makefile"; exit 1; }
          echo "--- fs/Makefile 末尾 ---"
          tail -3 fs/Makefile
          echo "--- 本轮这两个函数的调用点（0 次才符合预期）---"
          for F in susfs_switch_to_ksu_domain susfs_restore_creds; do
            C=$(grep -c "$F" fs/susfs.c)
            echo "$F 在 fs/susfs.c 出现 $C 次（定义+声明，无调用方即为死代码）"
          done

      - name: Pin kernel version string to stock KMI
        run: |
          # 实机实测（2026-11-02，adb shell uname -r）：
          #   原厂 UTS_RELEASE = 6.1.118-android14-11-o-g778e4490e346
          #   /vendor/lib/modules 有 406 个 .ko，lsmod 599 行，CONFIG_MODVERSIONS=y，
          #   原厂 /proc/config.gz 里没有 CONFIG_MODULE_FORCE_LOAD
          # 我们构建出来的是 6.1.118-android14-1-o-ga377f5434b5eb1（比原厂少一位 KMI 代际、
          # 且 git hash 不同）。vermagic 差一个字符，原厂那 406 个模块就全部拒载
          # —— Wi-Fi、触控、以及 sched_walt / oplus_bsp_* 全套调度模块都起不来。
          # 所以这里把版本串钉成原厂那条：清空 EXTRAVERSION，并把 setlocalversion
          # 换成只输出固定尾巴（不再依赖 git describe，避免每次构建串都在变）。
          set -e
          TARGET="${{ env.STOCK_UTS }}"
          # 消费端也再验一次：这条串会进 UTS_RELEASE，被内核 Makefile 的 $(shell …)
          # 原样拼进命令行，'|' / 空格 / 引号都会把编译炸掉（run 41543042993）。
          if printf '%s' "$TARGET" | grep -q '[^A-Za-z0-9._+-]'; then
            echo "::error::STOCK_UTS 含非法字符，拒绝钉串：[$TARGET]"; exit 1
          fi
          # 别的机型没有已知的原厂串时留空：不钉串，闸门仍会按本机 KMI 前缀拦住错线内核。
          if [ -z "$TARGET" ]; then
            echo "::warning::STOCK_UTS 为空 —— 本机原厂 uname -r 未知，跳过钉串（闸门按 $KERNEL_VERSION 前缀拦）"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          V=$(awk -F'= *' '/^VERSION/{print $2}' Makefile | head -1)
          P=$(awk -F'= *' '/^PATCHLEVEL/{print $2}' Makefile | head -1)
          S=$(awk -F'= *' '/^SUBLEVEL/{print $2}'    Makefile | head -1)
          BASE="$V.$P.$S"
          case "$TARGET" in
            "$BASE"*) ;;
            *) echo "::error::Makefile 版本基座是 $BASE，与目标串 $TARGET 不匹配，拒绝硬钉"
               exit 1 ;;
          esac
          SUFFIX="${TARGET#"$BASE"}"
          echo "基座=$BASE  尾巴=$SUFFIX"

          cp Makefile Makefile.orig
          sed -i 's/^EXTRAVERSION *=.*/EXTRAVERSION =/' Makefile
          grep -q '^EXTRAVERSION =$' Makefile || { echo "::error::EXTRAVERSION 没清空"; exit 1; }

          cp scripts/setlocalversion scripts/setlocalversion.orig
          # 生成器踩了两次坑，都记在这里：
          #  1) 外层 printf 会把文件内容里的 %s 当自己的格式吃掉（run 41396320984
          #     生成的成了 printf "-android…"，dash 报 Illegal option -a，被硬断言拦下）；
          #  2) heredoc 正文必须缩进到 block scalar 的同级列，顶格写会终结 `run: |`，
          #     GitHub 解析不出 workflow_dispatch（422 Workflow does not have trigger）。
          # 现在用单行 echo 组，既不跨行也没有格式冲突。
          { echo '#!/bin/sh'; echo "# pinned by workflow: 原逻辑依赖 git describe，会让每次构建的串都变"; echo "printf '%s\\n' '$SUFFIX'"; } > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "--- 生成的 setlocalversion ---"
          cat scripts/setlocalversion
          OUT="$(./scripts/setlocalversion .)"
          echo "setlocalversion 输出: [$OUT]"
          [ "$BASE$OUT" = "$TARGET" ] || {
            echo "::error::钉串失败：$BASE$OUT != $TARGET"; exit 1; }
          echo "✅ 版本串已钉死为原厂值：$TARGET（原厂模块的 vermagic 关卡过了）"
          echo "⚠️ 仍未证的另一半：MODVERSIONS 的符号 CRC。串一致不代表 CRC 一致，"
          echo "   若原厂 .ko 报 'disagrees about version of symbol' 则必须改用与原厂同代源码。"

      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          cd kernel_workspace/kernel_platform

          # 自动检测 LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # 强制递推路径
          CLANG_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/clang/host/linux-x86' \; -print | head -1)
          CLANG_PREBUILT_NAME=$(basename "${CLANG_PREBUILT_NAME:-}")
          echo "✅ CLANG_PREBUILT_NAME=$CLANG_PREBUILT_NAME"

          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/kernel-build-tools' \; -print | head -1)
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(basename "${KERNEL_BUILD_TOOLS_PREBUILT_NAME:-}")
          echo "✅ KERNEL_BUILD_TOOLS_PREBUILT_NAME=$KERNEL_BUILD_TOOLS_PREBUILT_NAME"

          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUST_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/rust' \; -print | head -1)
            RUST_TOOLS_PREBUILT_NAME=$(basename "${RUST_TOOLS_PREBUILT_NAME:-}")
            echo "✅ RUST_TOOLS_PREBUILT_NAME=$RUST_TOOLS_PREBUILT_NAME"
          fi

          # 从 build.config.common 读取 CLANG_PREBUILT_BIN，或者用递推路径 fallback
          CLANG_PREBUILT_BIN=""
          if [[ -f ./common/build.config.common ]]; then
            CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2-)
          fi

          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            CLANG_PREBUILT_BIN="${CLANG_PREBUILT_NAME}/clang/host/linux-x86/clang-zakozako/bin"
          fi

          # 优先尝试从 CLANG_PREBUILT_BIN 识别出 clang-r，再去掉 clang-，作为 CLANG_VERSION
          if [[ "$CLANG_PREBUILT_BIN" =~ clang-(r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从 build.config.constants 提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭 FAST_BUILD 并提交问题"
            exit 0
          fi

          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}"
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/clang-zakozako/clang-${CLANG_VERSION}}"

          echo "✅ CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN"
          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"

          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          CLANG_LIB_PATH="${CLANG_PREBUILT_BIN%/bin}"
          if [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib"
          elif [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib"
          else
            export LIBCLANG_PATH="$(clang --print-resource-dir 2>/dev/null | sed 's|/lib/clang/.*||')/lib" 
            echo "⚠️ LIBCLANG_PATH fallback to system: $LIBCLANG_PATH"
          fi
          echo "✅ LIBCLANG_PATH=$LIBCLANG_PATH"
          export PATH="/usr/lib/ccache:$PATH"

          # BINDGEN 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            BINDGEN_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_NAME/clang-tools/linux-x86/bin/bindgen"
            if [ -x "$BINDGEN_BIN" ]; then
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ bindgen exists: $BINDGEN_BIN"
            else
              echo "⚠️ prebuilts bindgen 未找到，fallback 到 cargo 安装 bindgen 0.69.5"
              echo "::group::Install bindgen via cargo"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              source "$HOME/.cargo/env"
              cargo install bindgen-cli --version 0.69.5
              echo "::endgroup::"
              BINDGEN_BIN=$(which bindgen)
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ BINDGEN_BIN (cargo): $BINDGEN_BIN"
            fi
          fi

          # PAHOLE 检测与 fallback
          PAHOLE_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$KERNEL_BUILD_TOOLS_PREBUILT_NAME/kernel-build-tools/linux-x86/bin/pahole"
          if [ ! -x "$PAHOLE_BIN" ]; then
            PAHOLE_BIN="$(which pahole 2>/dev/null)"
            [ -x "$PAHOLE_BIN" ] && echo "⚠️ pahole fallback to PATH: $PAHOLE_BIN"
          fi
          if [ -x "$PAHOLE_BIN" ]; then
            echo "✅ pahole exists: $PAHOLE_BIN"
          else
            echo "❌ pahole 完全缺失，终止构建"
            exit 13
          fi

          # RUSTC 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUSTC_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$RUST_TOOLS_PREBUILT_NAME/rust/linux-x86/$RUSTC_DIR_VERSION/bin/rustc"
            if [ ! -x "$RUSTC_BIN" ]; then
              RUSTC_BIN="$(which rustc 2>/dev/null)"
              [ -x "$RUSTC_BIN" ] && echo "⚠️ rustc fallback to PATH: $RUSTC_BIN"
            fi
            if [ -x "$RUSTC_BIN" ]; then
              echo "✅ rustc exists: $RUSTC_BIN"
              export RUSTC="$RUSTC_BIN"
            else
              echo "❌ rustc 完全缺失且 ENABLE_RUST=true，终止构建"
              exit 13
            fi
          fi

          LD_WRAPPER=""
          if [ "${{ github.event.inputs.BUILD_NOCACHE }}" = "false" ] && [[ "$KERNEL_VERSION" == 5.* ]]; then
            LDCACHE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/.thinlto-cache"
            mkdir -p "$LDCACHE_DIR"
            LD_WRAPPER="${GITHUB_WORKSPACE}/kernel_workspace/ld-wrapper"
            LLD_BIN="$(command -v ld.lld)"
            if [[ -z "$LLD_BIN" ]]; then
              echo "⚠️ ld.lld 未找到，无法创建 ld-wrapper"
            fi
            printf '#!/bin/bash\nexec "%s" "$@" --thinlto-cache-dir="%s" --thinlto-cache-policy=cache_size_bytes=3g --thinlto-jobs=%s\n' "$LLD_BIN" "$LDCACHE_DIR" "$(nproc --all)" > "$LD_WRAPPER"
            chmod +x "$LD_WRAPPER"
            echo "✅ ld-wrapper 已创建: $LD_WRAPPER (lld=$LLD_BIN, cache=$LDCACHE_DIR)"
          fi

          REAL_CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN/clang"
          CC_WRAPPER="$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper"
          printf '#!/bin/bash\nexec ccache "%s" "$@"\n' "$REAL_CLANG_BIN" > "$CC_WRAPPER"
          chmod +x "$CC_WRAPPER"
          echo "✅ cc-wrapper 已创建: $CC_WRAPPER (clang=$REAL_CLANG_BIN)"

          cd ./common

          # 重映射物理路径
          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          MAP="-fdebug-prefix-map=$ROOT_REAL_PATH=."
          MPMAP="-fmacro-prefix-map=$ROOT_REAL_PATH=."
          FPMAP="-ffile-prefix-map=$ROOT_REAL_PATH=."

          # KCFLAGS
          KCFLAGS="$MAP $FPMAP -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="$MPMAP"

          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="$CC_WRAPPER"
            HOSTCC="$CC_WRAPPER"
            HOSTLD=ld.lld
            PAHOLE="$PAHOLE_BIN"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )

          if [[ -n "${CONFIG_FAKE_DISABLE:-}" ]]; then
            MAKE_ARGS+=(CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE")
          fi
          if [[ -n "$LD_WRAPPER" ]]; then
            MAKE_ARGS+=(LD="$LD_WRAPPER")
          else
            MAKE_ARGS+=(LD=ld.lld)     
          fi
          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTC_BIN")
            MAKE_ARGS+=(BINDGEN="$BINDGEN_BIN")
          fi

          make O=out "${MAKE_ARGS[@]}" gki_defconfig --no-print-directory

          if [[ "$KERNEL_VERSION" == 5.* ]]; then
            echo "# 设置 LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi

          make O=out "${MAKE_ARGS[@]}" olddefconfig --no-print-directory
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s

      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用 make 编译的统一路径，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用官方脚本编译，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "❌ 未找到 Image 文件，构建失败" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "✅ Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi

      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          # KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpm"
          KPN_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpn"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux
          else
            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          fi
          mv -f oImage Image
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success&event=push" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "Failed to fetch artifact URL"
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        run: |
          # 原来这一步带 continue-on-error：下载失败就静默少发一个随包模块，
          # 隐藏能力直接掉一档而构建还是绿的 —— 这种"少东西"的失败必须响。
          set -e
          wget -q -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          unzip -l ksu_module_susfs_1.5.2+_Release.zip config.sh >/dev/null 2>&1 \
            || unzip -l ksu_module_susfs_1.5.2+_Release.zip '*/config.sh' >/dev/null 2>&1 \
            || { echo "::error::随包 susfs 模块下载/校验失败（缺 config.sh），不出这个降级包"; exit 1; }
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/
          echo "随包 susfs 模块就位：$(wc -c < ksu_module_susfs_1.5.2+_Release.zip) 字节"

      - name: Download Latest SukiSU-Ultra APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_ARTIFACT=Manager

          echo "Using branch: $KSU_MANAGER_BRANCH"
          echo "Downloading artifact: $MANAGER_ARTIFACT"

          run_id=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=$KSU_MANAGER_BRANCH&status=success&event=push&per_page=1" --jq '.workflow_runs[0].id' || echo "")

          if [[ -z "$run_id" ]]; then
            echo "No successful workflow run found on branch $KSU_MANAGER_BRANCH. Skipping download."
            exit 0
          fi
          artifact_url=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)

          if [[ -z "$artifact_url" ]]; then
            echo "No artifact '$MANAGER_ARTIFACT' found in run $run_id. Skipping download."
            exit 0
          fi
          echo "Downloading from: $artifact_url"
          curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./AnyKernel3/

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.ZRAM_ALGO_U && format('_{0}', env.ZRAM_ALGO_U) || '' }}${{ github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '_BBG' || '' }}_ILH${{ github.event.inputs.SCHED_HMBIRD== 'true' && '_HMBIRD' || '' }}${{ github.event.inputs.DROID_SPACES== 'true' && '_DS' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '_REKER' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && '_LZ4UPD' || '' }}" >> $GITHUB_OUTPUT

      - name: Compare stock vendor module CRCs against our kernel
        continue-on-error: true
        run: |
          # 唯一原本只能靠刷机才知道的问题：原厂 .ko 的 __versions 里记录的符号 CRC，
          # 和我们内核导出的 CRC 是否一致。这里从包里自带的四个原厂/厂商模块
          # （oplus_bsp_game_opt、crypto_lz4p、crypto_zstdp、perfmgr，共 98 个导入符号）
          # 取出它们要求的 CRC，与本次构建的 Module.symvers 对表。
          # 三个独立构建的原厂模块之间 CRC 冲突为 0，已证明解析布局正确。
          # 注意这是「测量」不是「闸门」：对不上不代表构建失败，代表刷进去模块会拒载，
          # 所以用 continue-on-error，但把 VERDICT 单独打到摘要里，绝不当成绿灯。
          cd "$GITHUB_WORKSPACE"
          # 脚本在本仓库 checkout 出来的 scripts/ 里（$GITHUB_WORKSPACE/scripts）。
          # kernel_workspace/Action-Build 是 Configure Git 现 clone 的上游 Numbersf 仓库，
          # 里面没有我们新增的 js —— 上一轮就因路径指错，node 报 Cannot find module，
          # 又被 tee 吃成空文件，只留下一句「没有输出判定行」，差点当成绿灯。
          # 两个候选路径都实测取不到，原因查清了：
          #   1) kernel_workspace/Action-Build 是 Configure Git 现 clone 的上游 Numbersf 仓库，
          #      里面只有上游自带的脚本，没有我们 fork 新加的 js；
          #   2) $GITHUB_WORKSPACE 那一份 checkout 被 Maximize Build Space 挂上来的新卷
          #      整个盖掉了（mount 点正是 /home/runner/work/Action-Build/Action-Build），
          #      所以仓库根下的 scripts/ 在后续步骤里根本不存在。
          # 改成按本次 commit 从 raw 地址取回，取回后还要验内容，绝不静默空跑。
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts"
          curl -fsSL "$RAW/crc_compare.js" -o crc_compare.js || { echo "::error::下载 crc_compare.js 失败"; exit 1; }
          curl -fsSL "$RAW/crc_stock.json" -o crc_stock.json || { echo "::error::下载 crc_stock.json 失败"; exit 1; }
          SCRIPT="$PWD/crc_compare.js"; STOCK="$PWD/crc_stock.json"
          { [ -s "$SCRIPT" ] && grep -q 'VERDICT' "$SCRIPT"; } || { echo "::error::取回的 crc_compare.js 内容不对：$RAW"; exit 1; }
          grep -q 'module_layout' "$STOCK" || { echo "::error::取回的 crc_stock.json 内容不对（没有 module_layout）"; exit 1; }
          echo "对表脚本就位: $SCRIPT ($(wc -c < "$SCRIPT") 字节)、需求表 $(wc -c < "$STOCK") 字节"
          find kernel_workspace -type f -name Module.symvers 2>/dev/null | head -20 > symvers.list
          N=$(wc -l < symvers.list)
          echo "找到 Module.symvers 文件数: $N"
          if [ "$N" = "0" ]; then
            echo "::warning::没有 Module.symvers，CRC 对表做不了（不代表通过）"
            exit 0
          fi
          echo "=== 使用原厂 game_opt（vermagic 6.1.57，OEM 构建）等模块的 CRC 需求 ==="
          set -o pipefail
          node "$SCRIPT" "$STOCK" $(tr '\n' ' ' < symvers.list) | tee crc-verdict.txt
          echo "--- VERDICT 行 ---"
          grep -a 'VERDICT' crc-verdict.txt || { echo "::error::CRC 对表没输出判定行，视为未证"; exit 1; }
          rm -f symvers.list

      - name: Verify SUSFS symbols made it into the Image
        if: github.event.inputs.SUSFS_META != '-1'
        run: |
          # 配置里写了 =y 不代表真编进内核（可能被 select 掉、可能上游改了名字），
          # 所以直接查产物里的符号名。
          # 期望清单改成两处结合：
          #  1) 硬断：只断「实机验证过、隐藏链路真的会调用」的入口 —— 上一轮这 9 个全在，
          #     所以断言不是凭空加的；
          #  2) 全覆盖报告：从真正拷进树里的 fs/susfs.c 现取所有非 static 的 susfs_* 函数，
          #     并解析每个函数外层的 #ifdef CONFIG_KSU_SUSFS_*，只把「上游 Kconfig 声明过的」
          #     算作应有项。这样既不用手写清单，也不会再把上游压根没声明的开关
          #     （KSU_SUSFS_PRIORITY_UID_FILTER 只有 tiann/KernelSU 有）当成回归。
          set -e
          cd "$GITHUB_WORKSPACE"
          IMG=$(find . kernel_workspace -maxdepth 4 -type f -name Image 2>/dev/null | head -n 1)
          [ -n "$IMG" ] || { echo "::error::找不到 Image 产物"; exit 1; }
          # -L 是必须的：MTK 单仓布局里 kernel_platform/common 是指向 ../kernel-<ver> 的符号链接，
          # find 默认不跟随，就会报「找不到 fs/susfs.c」（run 41663650850/41663658822 挂在这，
          # 而内核其实已经编出来了 —— 闸门自己的瞎，不是构建的瞎）。
          SRC=$(find -L . kernel_workspace -maxdepth 6 -type f \( -path "*/common/fs/susfs.c" -o -path "*/kernel-*/fs/susfs.c" \) 2>/dev/null | head -n 1)
          [ -n "$SRC" ] || { echo "::error::找不到拷进树里的 fs/susfs.c，无法核对符号面"; exit 1; }
          KC="${{ env.KSU_KCONFIG }}"
          if [ -z "$KC" ] || [ ! -f "$KC" ]; then
            KC=$(find "$GITHUB_WORKSPACE/kernel_workspace" -type f -name 'Kconfig*' 2>/dev/null | xargs -r grep -ls 'KSU_SUSFS_SPOOF_UNAME' 2>/dev/null | head -n 1)
          fi
          [ -n "$KC" ] || { echo "::error::找不到声明 KSU_SUSFS_* 的 Kconfig"; exit 1; }
          echo "检查 $IMG 里的 SUSFS 符号面（版本 $SUSFS_VER，源码 $SRC，声明面 $KC）"
          grep -aoE '^config (KSU_SUSFS_[A-Z0-9_]+|KSU_SUSFS)' "$KC" | sed 's/^config //' | sort -u > decl.txt
          # 还要认"我们主动设为 n"的那些：声明过 ≠ 打开。守卫是声明的，但值是我们自己关的，
          # 这类函数不在产物里是**设计**，不该混进缺失告警里当噪音（现在只有 ENABLE_LOG）。
          CONF=$(find -L . kernel_workspace -type f -path "*/arch/arm64/configs/gki_defconfig" 2>/dev/null | head -n 1)
          : > off.txt
          if [ -n "$CONF" ]; then
            { grep -oE '^CONFIG_KSU_SUSFS[A-Z0-9_]*=n$' "$CONF" | sed 's/^CONFIG_//; s/=n$//';
              grep -oE '^# CONFIG_KSU_SUSFS[A-Z0-9_]* is not set$' "$CONF" | sed 's/^# CONFIG_//; s/ is not set$//'; } | sort -u > off.txt
          fi
          # 函数名 + 它外层所有 KSU_SUSFS 守卫（可能嵌套，全部要求声明过才算应有）
          # 注意栈里要收*所有*#if 系列（含 LINUX_VERSION_CODE 这类），否则它们的
          # #endif 会把不属于它的 SUSFS 守卫弹掉，整个判定就错位了。
          awk '
            /^#if/ {
              g = ""
              if (match($0, /CONFIG_KSU_SUSFS_[A-Z0-9_]+/)) { g = substr($0, RSTART + 7, RLENGTH - 7) }
              stack[++d] = g
              next
            }
            /^(#else|#elif)/ { next }
            /^#endif/ { if (d > 0) { delete stack[d]; d-- } next }
            /^[^ \t#].*\(/ {
              if ($0 ~ /^static/) next
              if (!match($0, /[A-Za-z_][A-Za-z0-9_]*[ \t]*\(/)) next
              s = substr($0, RSTART, RLENGTH); gsub(/[ \t(]/, "", s)
              if (s !~ /^susfs_/) next
              guards = ""
              for (i = 1; i <= d; i++) if (stack[i] != "") guards = guards stack[i] " "
              print s "\t" guards
            }' "$SRC" > sym_guards.txt
          [ -s sym_guards.txt ] || { echo "::error::从 susfs.c 里一个非 static 函数都没提到，核对器自己是瞎的"; exit 1; }
          : > want.txt; : > skip.txt
          while IFS=$'\t' read -r NAME GUARDS; do
            UNSAT=""; OFFHIT=""
            for G in $GUARDS; do
              if ! grep -qx "$G" decl.txt; then UNSAT="$UNSAT $G"; fi
              if grep -qx "$G" off.txt; then OFFHIT="$OFFHIT $G"; fi
            done
            if [ -n "$UNSAT" ]; then printf '%s\t%s\n' "$NAME" "守卫未声明$UNSAT" >> skip.txt
            elif [ -n "$OFFHIT" ]; then printf '%s\t%s\n' "$NAME" "主动设为 n$OFFHIT" >> skip.txt
            else printf '%s\n' "$NAME" >> want.txt; fi
          done < sym_guards.txt
          sort -u -o want.txt want.txt; sort -u -o skip.txt skip.txt
          grep -ao "susfs_[a-z0-9_]*" "$IMG" | sort -u > have_syms.txt
          echo "源码非 static 的 susfs_* 函数: $(($(wc -l < want.txt) + $(wc -l < skip.txt))) 个（应有 $(wc -l < want.txt)，上游不支持 $(wc -l < skip.txt)）"
          if [ -s skip.txt ]; then
            echo "  这些函数按设计不会进产物（守卫未声明 / 我们主动关掉），不算回归："
            sed 's/^/    /' skip.txt
          fi
          MISS=$(comm -23 want.txt have_syms.txt | tr '\n' ' ')
          if [ -n "$MISS" ]; then echo "::warning::这些应有函数没在产物里查到（多为 LTO 内联/改名）：$MISS"; fi
          # 硬断：隐藏链路真正调用的入口，少一个就是回归，直接红。
          # 名字一律取自主动源码面（上一版这里手写清单里有个名字压根不是函数名，
          # 用的是子串匹配，结果既是假绿灯也是假红灯）。
          HARD="susfs_init susfs_add_sus_path susfs_add_sus_path_loop susfs_add_sus_map susfs_add_sus_kstat susfs_add_open_redirect susfs_set_uname susfs_set_cmdline_or_bootconfig susfs_set_hide_sus_mnts_for_non_su_procs susfs_get_enabled_features susfs_set_priority_uid_filter"
          HM=""
          for S in $HARD; do
            grep -qx "$S" want.txt || { echo "::error::硬断清单过期：$S 不在本次源码的应有函数里，请核对上游改名"; exit 1; }
            grep -qx "$S" have_syms.txt || HM="$HM $S"
          done
          [ -z "$HM" ] || { echo "::error::隐藏链路关键符号缺失：$HM"; exit 1; }
          echo "✅ 关键符号 $(echo $HARD | wc -w)/$(echo $HARD | wc -w) 都在产物里；产物里 susfs_* 名字共 $(wc -l < have_syms.txt) 个"
          if [ -z "$MISS" ]; then echo "✅ 上游声明的全部 SUSFS 函数都编进了产物"; fi
          rm -f decl.txt sym_guards.txt want.txt skip.txt have_syms.txt

      - name: Add flash-time guards to AnyKernel3
        run: |
          # 这个 fork 的 tools/ak3-core.sh 已经把 do.devicecheck / supported.versions
          # 的实现整段删掉了（grep 不到 deviceCheck / sdkversion），所以 anykernel.sh 里
          # 那些开关全是空头 —— 刷错机型、错固件都不会拦。
          # 而本包只在「手机当前内核串 == 本包内核串」时才安全：vermagic 不符会让
          # /vendor/lib/modules 那 406 个原厂模块全部拒载（Wi-Fi/触控/调度一起废）。
          # 所以在第一个动分区的动作 split_boot 之前自己插一道闸门。
          set -e
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          # grep 读不到时返回非 0，在 set -e 下会当场把这一步杀掉，导致下面那句
          # "::error::读不到 Image 的版本串" 永远印不出来 —— 结果是对的（拒绝出无闸门包），
          # 但日志里只剩一个没头没尾的退出码。|| true 让它走到显式报错。
          EXPECTED=$(grep -ao 'Linux version [^ ]*' Image | head -1 | cut -d' ' -f3 || true)
          if [ -z "$EXPECTED" ]; then
            echo "::error::读不到 Image 的版本串，拒绝在不加闸门的情况下出包"
            exit 1
          fi
          echo "本包内核串（闸门核本机 KMI 前缀 $KERNEL_VERSION.x；机型/SOC/安卓三项必查）: $EXPECTED"
          cp anykernel.sh anykernel.sh.orig
          G=guard.sh
          : > "$G"
          # 闸门期望值全部由本次构建的机型/SoC/KMI 推导，不再写死 Ace5 ——
          # 否则给 oneplus_13 出的包会拿 Ace5 的白名单去拦，或者反过来放行错的机器。
          CPU_UC=$(echo "$CPU" | tr 'a-z' 'A-Z')
          DEV_PAT=$(echo "${{ env.GUARD_DEVICES }}" | tr ' ' '\n' | grep -v '^$' | sed 's/^/*/; s/$/*/' | paste -sd'|' -)
          [ -n "$DEV_PAT" ] || DEV_PAT='*'
          # SoC 匹配串要能吃下 MTK 机的读法：ro.soc.model 常是营销名（Dimensity 9400），
          # ro.hardware 才是 mt6991/mediatek 这种小写 token，只列 *qcom* 会误拦 17 台 MTK。
          # 但厂商 token 必须**跟着目标走**：把 *qcom* 无条件留着，高通机刷 MTK 包
          # 就会被 SoC 这一项放行（反向测实测到了），那正是闸门最该拦的一种错刷。
          CPU_LC=$(echo "$CPU" | tr 'A-Z' 'a-z')
          case "$CPU" in
            mt*) SOC_VEND='*mediatek*|*mtk*' ;;
            *)   SOC_VEND='*qcom*|*snapdragon*' ;;
          esac
          SOC_PAT="*$CPU_UC*|*$CPUD*|*$CPU_LC*|$SOC_VEND"
          AND_PAT="$ANDROID_SHORT_VERSION*"
          echo "闸门期望：机型[$DEV_PAT] SoC[$SOC_PAT] 安卓[$AND_PAT] 内核前缀[$KERNEL_VERSION.]"
          echo '# ---- flash-time guard, injected by the workflow ----' >> "$G"
          echo 'ui_print "=== 本包维护/构建：汐颜 ==="' >> "$G"
          echo 'ui_print "本包目标机型: '"$FILE_CONF"'  SoC: '"$CPU"'  Android: '"$ANDROID_SHORT_VERSION"'"' >> "$G"
          echo 'EXPECTED_UTS="'"$EXPECTED"'"' >> "$G"
          echo 'CUR_UTS=$(uname -r)' >> "$G"
          echo 'ui_print "expected kernel: $EXPECTED_UTS"' >> "$G"
          echo 'ui_print "current  kernel: $CUR_UTS"' >> "$G"
          # 版本号只核本机 KMI 前缀（6.1 / 6.6 / 6.12 由本次构建推导），后面的 git hash 放行。
          echo 'BYPASS=""' >> "$G"
          # 旁路文件名三个都认：新闸门用 IGNORE_DEVICE_CHECK，但历史产物（以及旧文档）里
          # 写的是 IGNORE_ACE5_CHECK / IGNORE_UTS_CHECK。变砖自救只有一句话的容错空间，
          # 文档写的名字包不认 = 没有自救通道。
          echo 'for b in ./IGNORE_DEVICE_CHECK /sdcard/IGNORE_DEVICE_CHECK /tmp/IGNORE_DEVICE_CHECK ./IGNORE_ACE5_CHECK /sdcard/IGNORE_ACE5_CHECK /tmp/IGNORE_ACE5_CHECK ./IGNORE_UTS_CHECK /sdcard/IGNORE_UTS_CHECK /tmp/IGNORE_UTS_CHECK; do' >> "$G"
          echo '  if [ -f "$b" ]; then BYPASS=1; ui_print "发现旁路文件: $b"; fi' >> "$G"
          echo 'done' >> "$G"
          echo 'case "$CUR_UTS" in' >> "$G"
          echo '  '"$KERNEL_VERSION"'.*) : ;;' >> "$G"
          echo '  *) if [ -z "$BYPASS" ]; then ui_print "本机内核不是 '"$KERNEL_VERSION"'.x —— 这个包不是给你这条 KMI 的"; ui_print "要强行继续：在本包根目录放一个空文件 IGNORE_DEVICE_CHECK 再重刷"; abort "aborted by kernel line guard"; fi ;;' >> "$G"
          echo 'esac' >> "$G"
          if [ -z "${{ env.STOCK_UTS }}" ]; then
            # 档案里没填原厂 uname -r 的机型：把风险说白，别让「串不一样」被当成无所谓
            echo 'ui_print "⚠ 本包未钉原厂 uname -r（档案里这台机器的实机串还没收集）"' >> "$G"
            echo 'ui_print "⚠ 后果：原厂 400+ 个 .ko 可能因 vermagic 不符拒载（Wi-Fi/触控/调度失效）"' >> "$G"
            echo 'ui_print "⚠ 确认你能救砖（9008/深度烧机）再刷；刷前 adb shell uname -r 回报实机串可补进档案"' >> "$G"
          else
            echo 'ui_print "本包已钉原厂串（档案实机值）：'"${{ env.STOCK_UTS }}"'"' >> "$G"
            echo 'if [ -n "$EXPECTED_UTS" ] && [ "$CUR_UTS" != "$EXPECTED_UTS" ]; then' >> "$G"
            echo '  ui_print "提示：与原厂完整串不同（只核 '"$KERNEL_VERSION"'.x，已放行），原厂模块 vermagic 可能仍不合"' >> "$G"
            echo 'fi' >> "$G"
          fi
          # 机型/SOC/安卓三项：任一不符就拦；读不到 getprop 也算不符（宁可拦住）
          echo 'GP=1; command -v getprop >/dev/null 2>&1 || GP=0' >> "$G"
          echo 'DEV=""; SOC=""; AND=""' >> "$G"
          echo 'if [ "$GP" = "1" ]; then' >> "$G"
          echo '  DEV="$(getprop ro.product.device)$(getprop ro.product.vendor.device)"' >> "$G"
          echo '  SOC="$(getprop ro.soc.model)$(getprop ro.hardware)"' >> "$G"
          echo '  AND="$(getprop ro.build.version.release)"' >> "$G"
          echo 'fi' >> "$G"
          echo 'ui_print "device: [$DEV]  soc: [$SOC]  android: [$AND]"' >> "$G"
          echo 'BAD=""' >> "$G"
          echo 'if [ "$GP" != "1" ]; then BAD="getprop 不可用(可能是 recovery 缺 system)";' >> "$G"
          echo 'else' >> "$G"
          echo '  case "$DEV" in '"$DEV_PAT"') : ;; *) BAD="机型不在本包白名单（本包为 '"$FILE_CONF"'）" ;; esac' >> "$G"
          echo '  case "$SOC" in '"$SOC_PAT"') : ;; *) [ -z "$BAD" ] && BAD="SoC 与构建目标('"$CPU"')不符" ;; esac' >> "$G"
          echo '  case "$AND" in '"$AND_PAT"') : ;; *) [ -z "$BAD" ] && BAD="安卓版本与构建目标('"$ANDROID_SHORT_VERSION"')不符" ;; esac' >> "$G"
          echo 'fi' >> "$G"
          echo 'if [ -n "$BAD" ]; then' >> "$G"
          echo '  ui_print "设备检查未通过: $BAD"' >> "$G"
          echo '  ui_print "⚠ 继续刷入有可能变砖（boot 分区被换成本机不适用的内核）"' >> "$G"
          echo '  ui_print "⚠ 确认你能救（9008/深度烧机/fastboot 刷回原厂 boot）再决定"' >> "$G"
          echo '  if [ -z "$BYPASS" ]; then' >> "$G"
          echo '    ui_print "已中止。要强行继续：放一个空文件 IGNORE_DEVICE_CHECK 到本包根目录再重刷"' >> "$G"
          echo '    abort "aborted by device guard"' >> "$G"
          echo '  else' >> "$G"
          echo '    ui_print "检测到旁路文件，风险自负，继续写入 boot"' >> "$G"
          echo '  fi' >> "$G"
          echo 'fi' >> "$G"
          echo '' >> "$G"
          awk 'BEGIN{while((getline l < "guard.sh")>0) g=g l ORS}
               /^split_boot$/ && !done {printf "%s", g; done=1}
               {print}' anykernel.sh > anykernel.sh.new
          if cmp -s anykernel.sh anykernel.sh.new; then
            echo "::error::插入没有产生任何改动，拒绝输出未加闸门的包"
            exit 1
          fi
          grep -q 'aborted by device guard' anykernel.sh.new || { echo "::error::闸门文本不在新脚本里"; exit 1; }
          mv anykernel.sh.new anykernel.sh
          chmod +x anykernel.sh
          sh -n anykernel.sh || { echo "::error::改完的 anykernel.sh 语法不过"; exit 1; }
          rm -f "$G" anykernel.sh.orig

      - name: Harden the bundled susfs module
        if: always()
        run: |
          # 随包的 ksu_module_susfs 里 config.sh 才是隐藏总开关。这里不猜默认值，
          # 全部按模块源码（v1.5.2+_R28）里真实存在的键来改，并且每个键改之前先确认
          # 它还在文件里 —— 上游哪天改名，这一步会直接红，而不是安静地少一个开关。
          #
          # 开（都是 sus_mount/sus_path 系，SukiSU 声明过对应 CONFIG 的）：
          #   hide_loops hide_vendor_sepolicy hide_compat_matrix hide_cusrom
          #   spoof_cmdline（把 androidboot.verifiedbootstate=orange 改成 green —— 解锁/boot
          #     状态是风控第一眼看的东西，纯用户态 bind mount，不依赖额外内核开关）
          #   hide_sus_mnts_for_all_or_non_su_procs=1（对所有进程隐藏 sus 挂载）
          #   force_hide_lsposed / auto_try_umount / skip_legit_mounts
          #     （后两条是「卸掉的模块别留挂载」+「别误卸正经挂载」；内核没有
          #      CONFIG_KSU_SUSFS_TRY_UMOUNT 时模块自己会跳过/复位，不会坏事）
          #   avc_log_spoofing=1 —— 这条不是空转：`susfs_set_avc_log_spoofing` 在
          #     fs/susfs.c 里**没有任何 Kconfig 守卫**，且 SukiSU 的 supercall/dispatch.c
          #     确实 wire 了它（同表还有 set_uname / set_cmdline_or_bootconfig /
          #     set_priority_uid_filter / add_sus_path…共 16 个入口）。模块注释写明它
          #     用来绕开「靠 /proc/<pid> 枚举发现 su 域」，是主要探测面之一。
          # 关：
          #   susfs_log=0                        少一处日志指纹
          #   spoof_uname=0                      我们的内核串本来就钉成原厂值，伪造成
          #                                      另一个值只会造出 osrelease 与 banner 不一致的新破绽
          #   hide_gapps / hide_revanced=0       国行机没这些包，纯属多余挂载操作
          #   umount_for_zygote_iso_service=0 emulate_vold_app_data=0  收益不明、动的是别人的挂载
          set -e
          cd "$GITHUB_WORKSPACE"
          M=$(find . -maxdepth 3 -type f -name 'ksu_module_susfs_*.zip' | head -n 1)
          if [ -z "$M" ]; then echo "本轮没有随包 susfs 模块（SUSFS_CI=N/A），跳过"; exit 0; fi
          echo "要改的模块包: $M"
          rm -rf susmod && mkdir susmod
          unzip -q "$M" -d susmod
          C=$(find susmod -maxdepth 2 -type f -name config.sh | head -n 1)
          [ -n "$C" ] || { echo "::error::模块里没有 config.sh，无法核对隐藏开关"; exit 1; }
          PAIRS="hide_loops=1 hide_vendor_sepolicy=1 hide_compat_matrix=1 hide_cusrom=1 spoof_cmdline=1 hide_sus_mnts_for_all_or_non_su_procs=1 force_hide_lsposed=1 auto_try_umount=1 skip_legit_mounts=1 avc_log_spoofing=1 susfs_log=0 spoof_uname=0 hide_gapps=0 hide_revanced=0 umount_for_zygote_iso_service=0 emulate_vold_app_data=0"
          echo "=== 改前 ==="; grep -E '^[a-z_0-9]+=' "$C"
          for P in $PAIRS; do
            K=${P%%=*}; V=${P##*=}
            grep -qE "^$K=" "$C" || { echo "::error::模块 config.sh 里没有键 $K —— 上游改了开关名，本步隐藏清单要重新核对"; exit 1; }
            sed -i -E "s|^$K=.*|$K=$V|" "$C"
          done
          REL=$(grep -ao 'Linux version [^ ]*' AnyKernel3/Image 2>/dev/null | head -1 | cut -d' ' -f3)
          [ -n "$REL" ] || { echo "::error::读不到包内 Image 的版本串"; exit 1; }
          # uname -v 直接从这个 Image 的 banner 里取（不再手写 "#1 SMP PREEMPT $BUILD_TIME"）：
          # 手写值和真实值一旦不一致， spoof 反而制造破绽。取不到就退回 default 并保持
          # spoof_uname=0，这样两个值都是惰性文本，不可能自相矛盾。
          BANNER=$(grep -aoE 'Linux version [[:print:]]{10,240}' AnyKernel3/Image 2>/dev/null | head -1)
          BLD=$(printf '%s' "$BANNER" | sed -nE 's/.*(#[0-9]+ .*)/\1/p')
          # banner 尾部不该有架构名（那是 uname -m 的活），万一提取多吃了就剥掉；
          # 剥完仍不是一个「#N … 四位年份」的形状就整对退回 default，
          # 绝不留下半截假值 —— 伪装的 uname -v 与真实值不一致本身就是新破绽。
          BLD=$(printf '%s' "$BLD" | sed -E 's/ (aarch64|arm64)[[:print:]]*$//')
          printf '%s' "$BLD" | grep -qE '^#[0-9]+ .*[0-9]{4}$' || BLD=""
          if [ -n "$BLD" ]; then
            sed -i -E "s|^kernel_version=.*|kernel_version='$REL'|; s|^kernel_build=.*|kernel_build='$BLD'|" "$C"
            echo "伪装值（与真实值逐字一致，spoof_uname 仍为 0）: kernel_version=$REL"
            echo "                                kernel_build=$BLD"
          else
            sed -i -E "s|^kernel_version=.*|kernel_version='default'|; s|^kernel_build=.*|kernel_build='default'|" "$C"
            echo "::warning::从 Image banner 里没提出 uname -v，伪装值留 default（spoof_uname=0，惰性）"
          fi
          echo "=== 改后 ==="; grep -E '^[a-z_0-9]+=' "$C"
          for P in $PAIRS; do
            K=${P%%=*}; V=${P##*=}
            grep -qE "^$K=$V\$" "$C" || { echo "::error::$K 没写成 $V，隐藏开关未生效"; exit 1; }
          done
          cd susmod
          python3 -c "import zipfile,os;z=zipfile.ZipFile(os.path.abspath('../mod.zip'),'w',zipfile.ZIP_DEFLATED);[z.write(os.path.join(r,f),os.path.relpath(os.path.join(r,f))) for r,d,fs_ in os.walk('.') for f in fs_];z.close()"
          cd .. && mv -f mod.zip "$M"
          python3 -c "
          import zipfile,sys
          a=zipfile.ZipFile(r'''$M'''.replace(chr(92),'/'))
          n=[x for x in a.namelist() if x.endswith('config.sh')][0]
          t=a.read(n).decode('utf-8','replace')
          need=['hide_loops=1','hide_cusrom=1','hide_vendor_sepolicy=1','hide_compat_matrix=1','spoof_cmdline=1','avc_log_spoofing=1','susfs_log=0','spoof_uname=0']
          bad=[k for k in need if k not in t]
          if bad:
              print('重打包后缺键:', ' '.join(bad))
              sys.exit(1)
          sys.exit(0)" \
            || { echo "::error::重打包后的模块里隐藏开关不全"; exit 1; }
          echo "✅ 随包 susfs 模块已按极致隐藏配置重打包（16 个开关全部回读校验）"

      - name: Bundle and auto-install modules at flash time
        if: always()
        run: |
          # ZRAM 保持模块形态，但不再要求手工装：这里把它打进包内，并让刷写过程自动装。
          # 用的就是本包已有的可信路径 /data/adb/ksud module install（原逻辑要按音量键），
          # 不自己解包塞 /data/adb/modules，免得 SELinux 上下文出问题。
          set -e
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          # 这一步带 if: always()，更早的步骤失败时也会跑到这里。包里还没有闸门/取键段
          # 就说明上游没走完，直接跳过 —— 别把"更早失败"报成本步骤失败而埋掉根因。
          if ! grep -q 'getevent -qlc 1' anykernel.sh 2>/dev/null; then
            echo "AUTOINSTALL_SKIP: 包里还没有取键段（闸门步骤未跑完），本轮不改自动装逻辑"
            exit 0
          fi
          if [ ! -d "$GITHUB_WORKSPACE/ZRAM-Module" ]; then
            echo "本轮没产出 ZRAM-Module（ZRAM 输入为 0），只装包内已有的模块"
          else
            python3 -c "import zipfile,os;src=os.path.join(os.environ['GITHUB_WORKSPACE'],'ZRAM-Module');z=zipfile.ZipFile('ZRAM-Module.zip','w',zipfile.ZIP_STORED);[z.write(os.path.join(r,f),os.path.relpath(os.path.join(r,f),src)) for r,d,fs in os.walk(src) for f in fs];z.close()"
            python3 -c "import zipfile,sys;i=zipfile.ZipFile('ZRAM-Module.zip').getinfo('META-INF/com/google/android/update-binary');m=(i.external_attr>>16)&0o777;print('update-binary 权限=%o'%m);sys.exit(0 if m&0o111 else 1)" \
              || { echo "::error::打出来的 ZRAM 模块包 update-binary 没有执行位，装了也会失败"; exit 1; }
            echo "ZRAM 模块已打进包: $(wc -c < ZRAM-Module.zip) 字节"
          fi
          # 上游 susfs 那块用音量键决定装不装。这里历史上用 sed 改取键行，改完只要 grep 到
          # 'KEY_VOLUMEDOWN )' 就判通过 —— 但产物实测给出的是另一个结果：那行命令替换里
          # 混进了多个赋值和 echo，最终进 stdout 的只有 KEY_VOLUMEUP，于是永远走
          # 「跳过安装」分支；而下面的自动安装段又故意 continue 掉 ksu_module_susfs*.zip。
          # 两处合起来的净效果 = susfs4ksu 从来没被装上，sus mounts / sus path / loop 隐藏
          # 这些运行时隐藏面全丢。这才是"隐藏性垃圾"的主因，不是内核少编了什么。
          grep -q 'getevent -qlc 1' anykernel.sh || { echo "::error::找不到取键行，上游结构变了，拒绝继续"; exit 1; }
          # 两处取键：前一处是"要不要继续刷"，后一处是"要不要装 susfs 模块"。
          # 两行都改成常量，不再用命令替换（替换文本里混东西就是这次的事故来源）：
          # 第一处默认继续刷；第二处固定"不装"，装不装完全交给下面的自动段，避免装两遍。
          sed -i '0,/getevent/s#key_click=.*getevent.*#key_click=KEY_VOLUMEDOWN#' anykernel.sh
          sed -i 's#key_click=.*getevent.*#key_click=KEY_VOLUMEUP#' anykernel.sh
          [ "$(grep -c 'getevent' anykernel.sh)" = "0" ] || { echo "::error::还残留取键，无头刷会挂住"; exit 1; }
          # 上游 anykernel.sh 的最后一行 **没有换行符**（本地实测：echo 'x' >> 之后
          # 变成 "fi# ---- bundled …"，fi 被并进注释 → sh -n 报 unexpected end of file，
          # 整包直接刷不动）。追加前先补齐行尾换行。
          if [ -n "$(tail -c 1 anykernel.sh)" ]; then echo '' >> anykernel.sh; fi
          grep -q 'AUTO_INSTALL_BEGIN' anykernel.sh || {
            echo '# ---- bundled module auto-install, injected by the workflow ----' >> anykernel.sh
            echo '# ---- AUTO_INSTALL_BEGIN ----' >> anykernel.sh
            # 这两个路径在产物里保持原样（生产值就是 /data/…），只是允许被环境覆盖，
            # 否则本地/CI 的行为闸门根本没法在没有 /data 的机器上跑。
            echo 'KSUD_PATH="${KSUD_PATH:-/data/adb/ksud}"' >> anykernel.sh
            echo 'SUSFS_CFG="${SUSFS_CFG:-/data/adb/susfs4ksu/config.sh}"' >> anykernel.sh
            echo 'SUSFS_DIR="$(dirname "$SUSFS_CFG")"' >> anykernel.sh
            echo 'AUTO_N=0' >> anykernel.sh
            echo 'SUS_INS=0' >> anykernel.sh
            echo 'if [ -f ./SKIP_MODULE_INSTALL ]; then' >> anykernel.sh
            echo '  ui_print "检测到 SKIP_MODULE_INSTALL，模块自动安装已关闭"' >> anykernel.sh
            echo 'elif [ ! -f "$KSUD_PATH" ]; then' >> anykernel.sh
            echo '  ui_print "没找到 /data/adb/ksud（还没装 KernelSU？），跳过模块自动安装"' >> anykernel.sh
            echo 'else' >> anykernel.sh
            echo '  for M in "$AKHOME"/*.zip; do' >> anykernel.sh
            echo '    [ -f "$M" ] || continue' >> anykernel.sh
            echo '    ui_print "自动安装模块: $(basename "$M")"' >> anykernel.sh
            echo '    if "$KSUD_PATH" module install "$M"; then' >> anykernel.sh
            echo '      AUTO_N=$((AUTO_N+1))' >> anykernel.sh
            echo '      case "$(basename "$M")" in ksu_module_susfs*) SUS_INS=1 ;; esac' >> anykernel.sh
            echo '    else' >> anykernel.sh
            echo '      ui_print "安装失败: $(basename "$M")"' >> anykernel.sh
            echo '    fi' >> anykernel.sh
            echo '  done' >> anykernel.sh
            echo '  ui_print "模块自动安装完成，共 $AUTO_N 个"' >> anykernel.sh
            # 隐藏开关落地。/data/adb/susfs4ksu/config.sh 是**持久**文件，模块自带的
            # customize.sh 只做「补新键、绝不改旧键」（实测 174-188 行），所以出厂的
            # 全 0 值在装过第二遍的机器上会永久保留 —— 光把 config.sh 烘进模块 zip
            # 对老机器无效，必须刷完后强制覆盖。
            echo '  if [ "$SUS_INS" = "1" ]; then' >> anykernel.sh
            echo '    mkdir -p "$SUSFS_DIR"' >> anykernel.sh
            echo '    for KV in hide_loops=1 hide_vendor_sepolicy=1 hide_compat_matrix=1 hide_cusrom=1 spoof_cmdline=1 avc_log_spoofing=1 susfs_log=0; do' >> anykernel.sh
            echo '      K=${KV%%=*}' >> anykernel.sh
            echo '      if grep -q "^${K}=" "$SUSFS_CFG" 2>/dev/null; then' >> anykernel.sh
            echo '        sed -i "s|^${K}=.*|${KV}|" "$SUSFS_CFG"' >> anykernel.sh
            echo '      else' >> anykernel.sh
            echo '        echo "$KV" >> "$SUSFS_CFG"' >> anykernel.sh
            echo '      fi' >> anykernel.sh
            echo '    done' >> anykernel.sh
            echo '    ui_print "SUSFS 开关已强制落地: $(grep -E "^(hide_loops|hide_vendor_sepolicy|hide_compat_matrix|hide_cusrom|spoof_cmdline|avc_log_spoofing|susfs_log)=" "$SUSFS_CFG" | paste -sd" " -)"' >> anykernel.sh
            echo '  fi' >> anykernel.sh
            echo 'fi' >> anykernel.sh
            echo '# ---- AUTO_INSTALL_END ----' >> anykernel.sh
          }
          sh -n anykernel.sh || { echo "::error::改完的 anykernel.sh 语法不过"; exit 1; }
          grep -q 'AUTO_INSTALL_BEGIN' anykernel.sh || { echo "::error::自动安装段没写进去"; exit 1; }
          # 行为闸门：不 grep 文本，直接把自动段抽出来用假 ksud / 假 AKHOME 真跑一遍，
          # 看 susfs 模块是不是真被装上、7 个开关是不是真进了 config.sh。
          SB=$(mktemp -d); SB2=$(mktemp -d)
          mkdir -p "$SB/AKHOME" "$SB/data/adb/susfs4ksu" "$SB2/AKHOME" "$SB2/data/adb/susfs4ksu"
          awk '/AUTO_INSTALL_BEGIN/{f=1;next} /AUTO_INSTALL_END/{f=0} f' anykernel.sh > "$SB/blk.sh"
          printf '#!/bin/sh\nif [ "$1" = module ] && [ "$2" = install ]; then echo "$3" >> "$FAKE_KSUD_LOG"; fi\n' > "$SB/data/adb/ksud"
          chmod +x "$SB/data/adb/ksud" "$SB/blk.sh"
          ui_print() { echo "  >> $1"; }
          # 正向：包里有 susfs 模块 zip，且 config.sh 里已经是「出厂全 0」的老状态
          echo x > "$SB/AKHOME/ksu_module_susfs_1.5.2+_Release.zip"
          printf 'hide_loops=0\nsusfs_log=1\nspoof_uname=0\n' > "$SB/data/adb/susfs4ksu/config.sh"
          ( cd "$SB/AKHOME" \
            && AKHOME="$SB/AKHOME" KSUD_PATH="$SB/data/adb/ksud" FAKE_KSUD_LOG="$SB/installed.txt" \
               SUSFS_CFG="$SB/data/adb/susfs4ksu/config.sh" export AKHOME KSUD_PATH FAKE_KSUD_LOG SUSFS_CFG \
            && . "$SB/blk.sh" ) > "$SB/out.txt" 2>&1
          grep -q 'susfs' "$SB/installed.txt" 2>/dev/null || { echo "::error::自动段没把 susfs 模块装上（行为闸门）"; cat "$SB/out.txt"; exit 1; }
          for K in hide_loops=1 hide_vendor_sepolicy=1 hide_compat_matrix=1 hide_cusrom=1 spoof_cmdline=1 avc_log_spoofing=1 susfs_log=0; do
            grep -qx "$K" "$SB/data/adb/susfs4ksu/config.sh" || { echo "::error::开关 $K 没落到 config.sh"; cat "$SB/out.txt"; exit 1; }
          done
          grep -qx 'spoof_uname=0' "$SB/data/adb/susfs4ksu/config.sh" || { echo "::error::误伤了没打算动的 spoof_uname"; exit 1; }
          # 反向测：放 ./SKIP_MODULE_INSTALL 时必须一个都不装、也不许碰 config.sh
          echo x > "$SB2/AKHOME/ksu_module_susfs_a.zip"; : > "$SB2/AKHOME/SKIP_MODULE_INSTALL"
          cp "$SB/data/adb/ksud" "$SB2/ksud"
          printf 'hide_loops=0\n' > "$SB2/data/adb/susfs4ksu/config.sh"
          ( cd "$SB2/AKHOME" \
            && AKHOME="$SB2/AKHOME" KSUD_PATH="$SB2/ksud" FAKE_KSUD_LOG="$SB2/installed.txt" \
               SUSFS_CFG="$SB2/data/adb/susfs4ksu/config.sh" export AKHOME KSUD_PATH FAKE_KSUD_LOG SUSFS_CFG \
            && . "$SB/blk.sh" ) > "$SB2/out.txt" 2>&1
          [ ! -f "$SB2/installed.txt" ] || { echo "::error::SKIP_MODULE_INSTALL 没被尊重，还是装了模块"; exit 1; }
          grep -qx 'hide_loops=0' "$SB2/data/adb/susfs4ksu/config.sh" || { echo "::error::跳过安装时却改写了 config.sh"; exit 1; }
          rm -rf "$SB" "$SB2"
          echo "自动安装段：正向（装上 susfs + 7 开关强制落地）与反向（SKIP 时零动作）行为都验过"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.CKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Collect Oplus scheduler modules
        id: sched_mod
        run: |
          cd "$GITHUB_WORKSPACE"
          # 调度族在 vendor 树里，FAST_BUILD=true 时整棵树都不会产出，
          # 所以这里找不到 .ko 不等于「源码有问题」，只等于「这轮没编 vendor」。
          mkdir -p sched-modules
          : > sched-modules/modinfo.txt
          n=0
          for m in oplus_bsp_frame_boost oplus_bsp_sched_assist oplus_bsp_eas_opt \
                   oplus_bsp_schedinfo oplus_bsp_task_cpustats oplus_bsp_task_sched \
                   oplus_bsp_task_overload oplus_bsp_waker_identify oplus_bsp_omrg \
                   oplus_bsp_cpufreq_health sched-penalty sched-walt mpam_game \
                   oplus_bsp_sched_ext; do
            KO=$(find kernel_workspace -type f -name "${m}.ko" 2>/dev/null \
                 | grep -v '/unstripped/' | head -n 1)
            [ -z "$KO" ] && { echo "$m  未构建" >> sched-modules/modinfo.txt; continue; }
            cp "$KO" "sched-modules/${m}.ko"
            {
              echo "===== ${m}  <- $KO ====="
              modinfo "sched-modules/${m}.ko" 2>&1 \
                | grep -E '^(vermagic|name|version|depends|description|parm)'
            } >> sched-modules/modinfo.txt
            n=$((n+1))
          done
          echo "收到 $n 个调度模块"
          cat sched-modules/modinfo.txt

      - name: Read patched default out of the built module
        if: always()
        run: |
          # dist/ 下的 .ko 虽保留了 .symtab，但要读的是 .data 里的整数初值；
          # 这一步把「源码改动 → 模块二进制」直接证掉，不看绿灯。
          # 读取器是仓库里的 scripts/read_mod_value.js，本地已用合成 ELF 单测过
          # （能读出 60），因为构建机上用 python 我这边没法先验，Node 两边都能跑。
          cd "$GITHUB_WORKSPACE"
          # 同 CRC 那一步的路坑：用本仓库 checkout 的 scripts/，不用上游 clone。
          # 同 CRC 那一步：仓库根被挂载盖掉，按本次 commit 从 raw 取回。
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts"
          curl -fsSL "$RAW/read_mod_value.js" -o read_mod_value.js || { echo "::error::下载 read_mod_value.js 失败"; exit 1; }
          READER="$PWD/read_mod_value.js"
          { [ -s "$READER" ] && grep -q '符号' "$READER"; } || { echo "::error::取回的 read_mod_value.js 内容不对：$RAW"; exit 1; }
          echo "读取器就位: $READER ($(wc -c < "$READER") 字节)"
          for M in oplus_bsp_frame_boost oplus_bsp_sched_assist oplus_bsp_schedinfo; do
            KO=$(find kernel_workspace -type f -name "${M}.ko" 2>/dev/null | grep -v '/unstripped/' | head -n 1)
            [ -z "$KO" ] && { echo "$M: 本轮没产出（FAST 档不编厂商模块）"; continue; }
            echo "===== $M  <- $KO ====="
            node "$READER" "$KO" || { echo "::error::读取 $M 失败（不再当成通过）"; exit 1; }
          done


      - name: Report our exact vermagic
        if: always()
        run: |
          # 不开 pipefail：块里多条管道带 head/sort，SIGPIPE 会把整步打成退出码 2；
          # 真正的把关是末尾那句「判定行必须落盘」的 grep 断言。
          cd "$GITHUB_WORKSPACE"
          # 刷进去的内核与随包 .ko 都吃这条串；原厂 /vendor/lib/modules 期望的
          # 是手机 uname -r，两者必须逐字相同，否则原厂模块全部拒载。
          {
            echo "=== kernel.release（这就是 vermagic 的那一条串）==="
            find kernel_workspace -type f -name kernel.release 2>/dev/null | head -5 | while read -r f; do
              echo "$f -> $(cat "$f")"
            done
            echo "=== Image 自报版本 ==="
            strings -a AnyKernel3/Image 2>/dev/null | grep -m2 -a 'Linux version' || \
              grep -ao 'Linux version [^ ]*' AnyKernel3/Image 2>/dev/null | sort -u | head -3
            echo "=== git describe 现场 ==="
            ( cd kernel_workspace/kernel_platform/common 2>/dev/null && {
                git describe --tags 2>&1 || true
                git rev-parse --short HEAD 2>&1 || true
                echo "浅克隆=$(git rev-parse --is-shallow-repository 2>&1 || true)"
              } ) || true
            echo "=== 本轮产出的 .ko 自报 vermagic（去重计数）==="
            for K in $(find kernel_workspace -type f -name '*.ko' 2>/dev/null | grep -v '/unstripped/' | head -80); do
              V=$(grep -ao 'vermagic=[^ ]*[^ ]*' "$K" 2>/dev/null | head -1 | cut -d= -f2-)
              [ -n "$V" ] && echo "$V"
            done | sort | uniq -c | sort -rn | head -10
            echo "=== 自报串与 Image 是否同一条（判定行）==="
            IMG=$(grep -ao 'Linux version [^ ]*' "$GITHUB_WORKSPACE/AnyKernel3/Image" 2>/dev/null | head -1 | cut -d' ' -f3)
            MODS=$(for K in $(find kernel_workspace -type f -name '*.ko' 2>/dev/null | grep -v '/unstripped/' | head -80); do
              grep -ao 'vermagic=[^ ]*[^ ]*' "$K" 2>/dev/null | head -1 | cut -d= -f2-
            done | sort -u)
            echo "Image=$IMG"
            echo "模块串去重:"; echo "$MODS" | sed 's/^/  /'
            if [ -z "$MODS" ]; then echo "KO_VK_VERDICT: 本轮没有任何 .ko 产出，此项不适用（不是通过）";
            elif [ -z "$IMG" ]; then echo "KO_VK_VERDICT: 读不到 Image 版本串，未证";
            elif echo "$MODS" | grep -qxF "$IMG"; then echo "KO_VK_VERDICT: 至少一个模块串与 Image 完全相同";
            else echo "KO_VK_VERDICT: 本轮自产 .ko 的 vermagic 与刷进去的 Image 不同 —— 自产 .ko 不能随包加载"; fi
            echo "=== 版本相关 KCONFIG ==="
            grep -aE '^CONFIG_LOCALVERSION|^CONFIG_KALLSYMS|^CONFIG_MODVERSIONS|^CONFIG_MODULE_FORCE_LOAD' \
              kernel_workspace/kernel_platform/common/.config 2>/dev/null || true
          } | tee vermagic-report.txt
          # 这一段的输出走的是管道，退出码会被 tee 顶掉；上一轮就是被
          # git describe 的失败在 bash -e 下当场掐掉，后面判定行一行没跑，步骤却显示 success。
          grep -q 'KO_VK_VERDICT' vermagic-report.txt \
            || { echo "::error::vermagic 报告半路断了，判定行没写出来（不当成通过）"; exit 1; }
          echo "vermagic 报告完整：判定行已落盘"

      - name: Upload scheduler modules and vermagic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: sched-modules-${{ steps.extract_info.outputs.value }}
          path: |
            ./sched-modules/*
            ./vermagic-report.txt

      - name: Inventory built kernel modules
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          # 真实产物根目录是 kernel_platform/common/out（由 zram.ko 的实际路径证实），
          # 只查 kernel_platform/out 会误判为「未构建」，所以整树扫。
          OUT=kernel_workspace
          {
            echo "=== out 下所有 .ko（构建范围真实清单）==="
            find "$OUT" -type f -name '*.ko' 2>/dev/null | sed "s|$OUT/||" | sort
            echo
            echo "=== 计数 ==="
            find "$OUT" -type f -name '*.ko' 2>/dev/null | wc -l
            echo
            echo "=== 关键调度/性能模块是否在产物里 ==="
            for m in oplus_bsp_sched_ext sa_balance sa_common frame_boost oplus_game \
                    game_opt oplus_overload oplus_slc zram waker_identify; do
              hit=$(find "$OUT" -type f -name "*${m}*.ko" 2>/dev/null | head -1)
              printf "%-24s %s\n" "$m" "${hit:-未构建}"
            done
          } | tee module-inventory.txt

      - name: Upload module inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: module-inventory-${{ steps.extract_info.outputs.value }}
          path: ./module-inventory.txt

      - name: Extract and Process ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/')
        id: zram_find
        run: |
          set -e
          ZRAM_ZIP="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip"

          if [ ! -f "$ZRAM_ZIP" ]; then
            echo "❌ 未找到 ZRAM.zip: $ZRAM_ZIP"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip "$ZRAM_ZIP" -d ZRAM-Module

          CONFIG_PROP="ZRAM-Module/config.prop"
          if [ -f "$CONFIG_PROP" ]; then
            echo "修改 config.prop"
            sed -i "s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/" "$CONFIG_PROP"
            sed -i "s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/" "$CONFIG_PROP"
            echo "ZRAM_ALGO=${ZRAM_ALGO}"
            echo "ZRAM_SIZE=${ZRAM_SIZE}"
          else
            echo "❌ 未找到 config.prop"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="./ZRAM-Module/zram/zram.ko"
          echo "查找 zram.ko 模块文件..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            if [ -d "$path" ]; then
              zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
              [ -n "$zram_path" ] && break
            fi
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "✅ zram.ko file finally located at: $zram_path"
            install -D "$zram_path" "$target"
          else
            echo "❌ 未找到 zram.ko 文件，可能是未支持的内核版本或构建失败"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Upload ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/') && steps.zram_find.outputs.upload != 'false'
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      - name: Check Cache Size Before Save
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: cache_size_check
        run: |
          check_size() {
            local CACHE_DIR="$1"
            local CACHE_NAME="$2"
            if [[ ! -d "$CACHE_DIR" ]]; then
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
              return
            fi
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            echo "$CACHE_DIR 大小: ${SIZE_MB}MB"
            if (( SIZE_MB >= 5 )); then
              echo "${CACHE_NAME}_save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Cache Warning::$CACHE_NAME 小于 5MB，跳过保存"
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_size "${{ env.CCACHE_DIR }}" "ccache"
          check_size "${{ github.workspace }}/kernel_workspace/.thinlto-cache" "thinlto"

      - name: Save Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && steps.cache_size_check.outputs.ccache_save == 'true' && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-17.0

      - name: Save ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' && steps.cache_size_check.outputs.thinlto_save == 'true' && steps.restore-thinlto.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-17.0

      - name: Post-build Disk Check
        run: df -h